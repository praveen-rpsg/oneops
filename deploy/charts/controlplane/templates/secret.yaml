{{- if not .Values.existingSecret }}
# Generated only when .Values.existingSecret is unset. Carries the insecure
# dev-default credentials so a plain `helm install` still boots, but keeps
# them out of the Deployment spec (see controlplane.secretName in
# _helpers.tpl). Production installs must set existingSecret instead and
# provision that Secret out of band.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "controlplane.fullname" . }}
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
type: Opaque
stringData:
  ONEOPS_DB_URL: {{ .Values.secretEnv.ONEOPS_DB_URL | quote }}
  ONEOPS_JWT_HMAC_KEY: {{ .Values.secretEnv.ONEOPS_JWT_HMAC_KEY | quote }}
{{- end }}
