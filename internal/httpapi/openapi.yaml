  /v1/admin/telemetry:
    post:
      summary: Ingest a batch of metric samples tied to Configuration Items (E2.1)
      description: >-
        The first monitoring signal, and the spine alerting (E3) will derive
        from. asset_id names an EXISTING asset — re-verified against the
        caller's tenant before any row naming it is written, so a
        cross-tenant or nonexistent asset_id is rejected, not silently
        stored (ADR-TELEMETRY-001). Each sample is validated and reported
        independently at its own index — one bad sample does not abort the
        batch around it, the same shape POST /admin/assets/import already
        established. Re-sending an identical (asset_id, metric, timestamp)
        sample is idempotent: it is reported accepted again and writes no
        second row. Bounded to 1000 samples per call.
      operationId: ingestTelemetry
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestTelemetryRequest' }
      responses:
        '200':
          description: One result per input sample, in input order
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestTelemetryResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    get:
      summary: Query a bounded, paginated range of one asset's one metric (E2.1)
      description: >-
        Row-level security confines the result to the caller's tenant; an
        asset_id belonging to another tenant (or naming nothing at all)
        returns an empty page, not an error — the same answer every other
        read in this schema gives for an invisible id. Ordered by timestamp
        ascending; a caller with more samples than one page fits re-queries
        with `after` set to the last item's timestamp.
      operationId: queryTelemetry
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: asset_id, in: query, required: true, schema: { type: string } }
        - { name: metric, in: query, required: true, schema: { type: string } }
        - name: from
          in: query
          required: true
          description: RFC3339 timestamp, inclusive lower bound.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: RFC3339 timestamp, inclusive upper bound.
          schema: { type: string, format: date-time }
        - name: after
          in: query
          description: Keyset cursor — the timestamp of the last sample of the previous page, exclusive.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000 }
        - name: resolution
          in: query
          description: >-
            "raw" for individual samples, "rollup_5m" for the 5-minute
            avg/min/max/count rollup, or omitted for automatic selection
            (raw for a short window, rollup_5m for a wide one, E2.1b).
            An explicit "raw" over a very wide window is rejected (422):
            request rollup_5m, or narrow the window.
          schema: { type: string, enum: [raw, rollup_5m] }
      responses:
        '200':
          description: A page of samples, ordered by timestamp ascending
          content: { application/json: { schema: { $ref: '#/components/schemas/SampleList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

