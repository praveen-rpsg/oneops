  /v1/admin/incidents/{id}/timeline:
    get:
      summary: An incident's append-only case timeline (E5.1)
      description: >-
        Every recorded event on this Incident — created, status transitions,
        assignment changes — each with actor, old->new value and timestamp,
        in chronological order. Written by IncidentStore.Create/SetStatus/
        Assign in the same transaction as the mutation it describes;
        incident_event is append-only at the schema level (ENABLE ALWAYS
        triggers + revoked UPDATE/DELETE/TRUNCATE), mirroring
        asset_change_history. Paging is keyset over `event_id`, a ULID and
        therefore chronological.
      operationId: getIncidentTimeline
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last event_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of the incident's timeline
          content: { application/json: { schema: { $ref: '#/components/schemas/IncidentTimelineList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/noc/overview:
    get:
      summary: NOC operational-overview projection (E7.1, read-only)
      description: >-
        The current operational state of the whole NOC loop, computed at
        request time from the incident/alert-rule/asset/on-call/
        escalation-state stores — a transient DTO, never a stored
        Dashboard/Report/Overview entity (docs/PLATFORM-BUILD-PLAN.md §4,
        Vol III §3.4). incidents/alerts are scoped to open-class incidents
        (open, acknowledged, investigating) and currently-firing enabled
        alert rules respectively; assets reuses GET /admin/assets/health's
        category counts; on_call lists up to 100 of the caller's ACTIVE
        on-call schedules (bounded — see the handler's own doc comment) with
        who is on call right now for each; escalations is the current size
        of the escalation_state work-queue. Every read is on the
        tenant-scoped, row-level-security-enforced connection: no explicit
        tenant predicate is needed and none is added. Telemetry summary and
        real-time streaming are deliberately out of scope for this story
        (ADR-NOC-001).
      operationId: nocOverview
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: The current NOC overview
          content: { application/json: { schema: { $ref: '#/components/schemas/NOCOverview' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/dashboards/incident-trends:
    get:
      summary: Incident-trends projection — volume over time (E9.1, read-only)
      description: >-
        Incident open/resolve volume bucketed at hour/day granularity over
        [from, to), split by severity and by source — the data source E9.2's
        dashboards screen renders. A transient, computed-at-request-time
        projection, never a stored Dashboard/Report entity
        (docs/PLATFORM-BUILD-PLAN.md §4), the same shape GET
        /admin/noc/overview establishes. Tenant isolation is row-level
        security alone: no explicit tenant predicate, no privileged pool
        (ADR-NOC-008). The response is a CONTIGUOUS, zero-filled series: a
        bucket with no matching incidents still appears, zeroed, so a line
        chart has no gaps. Bounded: at most 744 contiguous buckets (a month
        of hourly buckets) per request — a finer bucket over a wider window
        is refused with 422, not answered as an oversized response.
        opened_by_source.alert is the honest alert-VOLUME proxy: this system
        has no alert-firing log (no alert_event table), so it counts
        alert-*sourced incidents* (domain.Incident.Source, E4.1's
        correlation pipeline), not raw firings.
      operationId: incidentTrends
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the half-open window (inclusive), RFC 3339.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: End of the half-open window (exclusive), RFC 3339. Must be after from.
          schema: { type: string, format: date-time }
        - name: bucket
          in: query
          required: true
          description: Bucket granularity.
          schema: { type: string, enum: [hour, day] }
      responses:
        '200':
          description: The incident-trends series
          content: { application/json: { schema: { $ref: '#/components/schemas/IncidentTrends' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/notifications:
    get:
      summary: List the caller's tenant's notifications
