    post:
      summary: Assign or unassign an incident (E5.1)
      description: >-
        The single authority for the assignee field. assignee_user_id null
        clears the assignment; a non-null id must name a user with an ACTIVE
        membership in the caller's tenant, re-verified server-side before the
        write (app_user is global; membership is the tenant fact).
