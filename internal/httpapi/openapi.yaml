  /v1/admin/assets:
    get:
      summary: List the caller's tenant's CMDB assets (Configuration Items)
      description: >-
        asset is tenant-owned and under row-level security, exactly like
        Team, so the result is confined to the caller's tenant by the
        database. Paging is keyset over `asset_id`, a ULID and therefore
        ordered by creation. By default a retired asset is excluded
        (soft-retire, E1.3) — it still exists and is still fetchable via
        GET /admin/assets/{id}, just not in this default view — and
        ?status=retired lists exactly the retired ones.
      operationId: listAssets
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last asset_id of the previous page.
          schema: { type: string }
        - name: status
          in: query
          description: >-
            Filter to exactly this status. Omitted, the default view
            excludes retired but includes every other status.
          schema: { type: string, enum: [planned, active, maintenance, retired] }
      responses:
        '200':
          description: A page of assets
          content: { application/json: { schema: { $ref: '#/components/schemas/AssetList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Register a Configuration Item
      description: >-
        The tenant is taken from the bound connection and never from the
        request, so a caller cannot plant an asset inside another boundary
        (the same rule createTeam enforces). `type` is an open but validated
        set (lower-case snake_case) — server, service, network_device,
        application, database and future increments' types are all accepted.
      operationId: createAsset
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssetRequest' }
      responses:
        '201':
          description: The asset
          content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/import:
    post:
      summary: Bulk-upsert Configuration Items by (tenant, source, external_ref)
      description: >-
        The idempotent multi-source CMDB ingestion path (E1.4). A row without
        external_ref always creates; a row whose external_ref matches an
        existing (tenant, source, external_ref) triple is updated, replacing
        every field the row carries and recording change history for each
        field that actually changed (the E1.3 path) — re-importing an
        identical payload therefore creates no new rows and writes no
        history. Each row is processed and reported independently at its
        own index; one bad row (a validation failure, an owner reference the
        tenant cannot see) does not abort the rows around it. Bounded to
        1000 rows per call.
      operationId: importAssets
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportAssetsRequest' }
      responses:
        '200':
          description: One result per input row, in input order
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportAssetsResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/export:
    get:
      summary: Paginated full export of the caller's tenant's CMDB
      description: >-
        Every asset, every field, every status — INCLUDING retired — for
        backup or migration (E1.4). Unlike GET /admin/assets, retirement
        does not filter this view. Paging is keyset over `asset_id`, the
        same shape listAssets uses. Relationship export is deferred to a
        later increment (E1.4b).
      operationId: exportAssets
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last asset_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of every asset, regardless of status
          content: { application/json: { schema: { $ref: '#/components/schemas/AssetList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/duplicates:
    get:
      summary: Report likely-duplicate Configuration Items (read-only)
      description: >-
        Groups of assets AssetRepository.Duplicates believes represent the
        same real-world CI (E1.4): the same external_ref reported by two or
        more DIFFERENT sources, and/or the same type with the same name
        after normalization (trimmed, case-folded). This is a projection —
        nothing here merges or mutates anything. Controlled merge/resolution
        is E1.4b, a separately gated later increment.
      operationId: duplicateAssets
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Grouped duplicate candidates
          content: { application/json: { schema: { $ref: '#/components/schemas/AssetDuplicateGroupList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/health:
    get:
      summary: CMDB data-quality/freshness report (read-only)
      description: >-
        Where the CMDB is rotting, never whether it matches reality (E1.5) —
        true config-drift-vs-discovered-state needs E2's monitoring/discovery
        and is explicitly out of scope. Three categories, each a count plus a
        bounded sample: stale (active/maintenance CIs whose last_seen is
        older than stale_after, or null — never confirmed by any source),
        orphaned_assets (no relationship at all, neither incoming nor
        outgoing) and orphaned_business_services (a business_service with no
        outgoing depends_on/runs_on edge), and incomplete (unowned, or
        criticality/environment left at "unknown"). A retired CI is excluded
        from every category, the same soft-retire default GET /admin/assets
        applies.
      operationId: assetHealth
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: stale_after
          in: query
          description: >-
            A Go duration (e.g. "720h", "30m"). Defaults to 720h (30 days)
            when omitted.
          schema: { type: string }
      responses:
        '200':
          description: The CMDB health report
          content: { application/json: { schema: { $ref: '#/components/schemas/AssetHealthReport' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/graph:
    get:
      summary: Whole-tenant CMDB asset-graph projection (read-only)
      description: >-
        Every asset as a node and every relationship as an edge, in one
        bounded call — the data source the topology-map UI (E7.3b-2) needs
        instead of N+1 per-asset relationship queries (E7.3b-1). Tenant
        isolation is enforced by row-level security alone, exactly like
        GET /admin/noc/overview (ADR-NOC-001): no explicit tenant predicate.
        Bounded: at most 2000 nodes and 5000 edges, each ordered by its own
        primary key (asset_id / relationship_id) so a truncated page is the
        same first-N rows on a repeated call; truncated is true when either
        cap was reached. Not soft-retire-filtered, unlike GET /admin/assets —
        a topology map renders a retired CI's position rather than hiding it.
        Nodes and edges are not joined server-side; a caller reconciles them
        by asset_id, and composes incident/health overlay client-side from
        the existing incidents/health endpoints (ADR-NOC-006).
      operationId: assetGraph
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: The tenant's asset graph
          content: { application/json: { schema: { $ref: '#/components/schemas/AssetGraph' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/relationships:
    post:
      summary: Create a CMDB relationship between two assets
      description: >-
        Both from_asset_id and to_asset_id must already name assets visible
        to the caller's tenant — confirmed on the tenant-scoped connection
        before the edge is created, because PostgreSQL's foreign-key checks
        bypass row-level security on the referenced table (ADR-ASSET-001
        §6). A from/to id the tenant cannot see returns 404, identical to one
        that does not exist.
      operationId: createAssetRelationship
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssetRelationshipRequest' }
      responses:
        '201':
          description: The relationship
          content: { application/json: { schema: { $ref: '#/components/schemas/AssetRelationship' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/relationships/{id}:
    delete:
      summary: Remove a CMDB relationship
      operationId: deleteAssetRelationship
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: The relationship was removed
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/{id}:
    get:
      summary: Get an asset by identifier
      operationId: getAsset
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The asset
          content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Change an asset's fields, or perform a lifecycle transition
      description: >-
        Two mutually exclusive shapes (E1.3): supply status ALONE to
        transition the CMDB lifecycle (planned/active/maintenance/retired,
        checked against AssetStatus.CanTransitionTo — an illegal move
        returns 409), or supply one or more of name, attributes,
        environment, criticality, owner_team_id, owner_user_id (freely
        combinable — Asset has no authorisation-adjacent split among these).
        Combining status with any other field is refused with 422.
      operationId: patchAsset
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchAssetRequest' }
      responses:
        '200':
          description: The updated asset
          content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete an asset
      description: >-
        A real delete, unlike Team's archive-only lifecycle: an Asset is not
        a named governed grouping. Its relationships are removed with it
        (ON DELETE CASCADE).
      operationId: deleteAsset
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: The asset was deleted
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/{id}/relationships:
    get:
      summary: List the direct (one-hop) relationships naming an asset
      operationId: listAssetRelationships
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The asset's direct in- and out-edges
          content: { application/json: { schema: { $ref: '#/components/schemas/AssetRelationshipEdges' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/{id}/dependencies:
    get:
      summary: Dependencies of an asset in the CMDB graph (forward)
      description: >
        Direct dependencies by default; the transitive forward closure when
        recursive=true. Reuses the same dependency-graph engine
        /v1/configurations/{cfgId}/dependencies uses, over asset_relationship
        instead of dependency_edge (ADR-ASSET-001 §4).
      operationId: getAssetDependencies
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: recursive, in: query, schema: { type: boolean, default: false } }
        - { name: max_depth, in: query, schema: { type: integer, minimum: 1 }, description: Cap recursive depth. }
      responses:
        '200':
          description: Reachable dependency nodes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetTraversalResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/{id}/dependents:
    get:
      summary: Dependents of an asset in the CMDB graph (reverse)
      description: >
        Direct dependents by default; the transitive reverse closure when
        recursive=true.
      operationId: getAssetDependents
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: recursive, in: query, schema: { type: boolean, default: false } }
        - { name: max_depth, in: query, schema: { type: integer, minimum: 1 }, description: Cap recursive depth. }
      responses:
        '200':
          description: Reachable dependent nodes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetTraversalResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/{id}/service-map:
    get:
      summary: Business-service composition — the supporting CIs of a business_service
      description: >-
        A projection over the CMDB graph, not a new stored structure: the
        transitive closure of the target's depends_on/runs_on edges only
        (connected_to is a network link and member_of is grouping, neither
        composes a service), computed by the same recursive-CTE traversal
        engine /dependencies uses (ADR-ASSET-001 §4). The target asset must
        be of type business_service.
      operationId: getAssetServiceMap
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The business_service's supporting Configuration Items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceMapResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/{id}/history:
    get:
      summary: An asset's append-only change history (E1.3)
      description: >-
        Every recorded change to this Configuration Item — field, old/new
        value, actor and the resulting row_version — in chronological order.
        Written by AssetStore.Create/Update/SetStatus in the same
        transaction as the mutation it describes; asset_change_history is
        append-only at the schema level (ENABLE ALWAYS triggers + revoked
        UPDATE/DELETE/TRUNCATE), mirroring audit_event. Paging is keyset
        over `change_id`, a ULID and therefore chronological.
      operationId: getAssetHistory
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last change_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of the asset's change history
          content: { application/json: { schema: { $ref: '#/components/schemas/AssetChangeHistoryList' } } }
