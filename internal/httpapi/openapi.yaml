  /v1/admin/incidents:
    get:
      summary: List the caller's tenant's incidents (E5.1)
      description: >-
        incident is tenant-owned and under row-level security, exactly like
        Asset, so the result is confined to the caller's tenant by the
        database. Paging is keyset over `incident_id`, a ULID and therefore
        ordered by creation. Unlike GET /admin/assets, there is no default
        status exclusion — a closed incident remains relevant operational
        history, not noise to hide.
      operationId: listIncidents
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last incident_id of the previous page.
          schema: { type: string }
        - name: status
          in: query
          description: Filter to exactly this status. Omitted, every status is returned.
          schema: { type: string, enum: [open, acknowledged, investigating, resolved, closed, reopened] }
      responses:
        '200':
          description: A page of incidents
          content: { application/json: { schema: { $ref: '#/components/schemas/IncidentList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: File a new Incident (E5.1)
      description: >-
        Always created IncidentOpen — there is no caller-chosen initial
        status. The tenant is taken from the bound connection and never from
        the request, so a caller cannot plant an incident inside another
        boundary (the same rule createAsset/createTeam enforce). asset_id,
        when supplied, must already name a Configuration Item visible to the
        caller's tenant (ADR-ASSET-001 §6); assignee_user_id, when supplied,
        must name a user with an ACTIVE membership in the caller's tenant —
        app_user is global, membership is the tenant fact. Either mismatch
        returns 404.
      operationId: createIncident
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIncidentRequest' }
      responses:
        '201':
          description: The incident
          content: { application/json: { schema: { $ref: '#/components/schemas/Incident' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/incidents/{id}:
    get:
      summary: Get an incident by identifier
      operationId: getIncident
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The incident
          content: { application/json: { schema: { $ref: '#/components/schemas/Incident' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Change an incident's title, description, severity or linked asset
      description: >-
        status and assignee_user_id are excluded from this endpoint — POST
        .../transition and POST .../assign are their single authorities
        (mirrors PatchAssetRequest excluding status). asset_id is tri-state:
        absent leaves the link unchanged, "" clears it, and a non-empty id
        sets it, re-verified against the caller's tenant first. Writes no
        timeline row — the timeline records the case narrative (created,
        transitions, assignment changes), not a field-by-field audit.
      operationId: patchIncident
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
