  /v1/admin/webhooks/replay/jobs/{jobID}:
    get:
      summary: Get a replay job
      operationId: getReplayJob
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
