          description: Timeline
          content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/policies/{id}/timeline:
    get:
      summary: Execution timeline for a policy execution
      operationId: getPolicyTimeline
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Timeline
          content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } }
        '404': { $ref: '#/components/responses/Problem' }

  # Compliance & evidence (admin) — read-only. Deterministic evidence composed
  # from existing persisted data; participates in no execution.
  /v1/admin/compliance/reports:
    get:
      summary: List compliance summaries across governance objects
      operationId: getComplianceReports
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Compliance report page
          content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceReportPage' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/compliance/{governanceID}:
    get:
      summary: Compliance status summary for a governance object
      operationId: getComplianceSummary
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: governanceID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Compliance summary
          content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceSummary' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/compliance/{governanceID}/evidence:
    get:
      summary: Immutable evidence bundle (JSON, or ZIP with format=zip)
      operationId: getComplianceEvidence
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: governanceID, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, zip] } }
      responses:
        '200':
          description: Evidence bundle
          content:
            application/json: { schema: { $ref: '#/components/schemas/Evidence' } }
            application/zip: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/compliance/{governanceID}/checks:
    get:
      summary: Compliance check results for a governance object
      operationId: getComplianceChecks
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: governanceID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Compliance checks
          content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceCheckList' } } }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GovId:
      name: id
      in: path
      required: true
      description: Configuration object id (cfg_id).
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Idempotency key; used as the OperationID and drives the deterministic audit event id.
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected row_version (ETag) for optimistic concurrency; omit to skip the check.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum items to return (bounded by the server maximum).
      schema: { type: integer, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor (last seq of the previous page).
      schema: { type: string }
    Order:
      name: order
      in: query
      required: false
      description: Sort order by sequence.
      schema: { type: string, enum: [asc, desc], default: asc }
    OperationFilter:
      name: operation
      in: query
      required: false
      description: Filter to a single §8 operation.
      schema: { type: string }
    TimelineFrom:
      name: from
      in: query
      required: false
      description: Include entries at or after this RFC3339 time.
      schema: { type: string, format: date-time }
    TimelineTo:
      name: to
      in: query
      required: false
      description: Include entries at or before this RFC3339 time.
      schema: { type: string, format: date-time }
    TimelineComponent:
      name: component
      in: query
      required: false
      schema: { type: string, enum: [governance, audit, webhook, replay, policy] }
    TimelineStatus:
      name: status
      in: query
      required: false
      schema: { type: string }
    TimelineOffset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
  responses:
    Problem:
      description: RFC 7807 problem detail
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GovernanceResult:
      description: The operation was applied atomically with its audit event.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GovernanceResponse' }
  schemas:
    Membership:
      type: object
      properties:
        membership_id: { type: string }
        org_id: { type: string }
        user_id: { type: string }
        status: { type: string, enum: [active, revoked] }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MembershipList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
    GrantMembershipRequest:
      type: object
      required: [org_id, user_id]
      properties:
        org_id: { type: string }
        user_id: { type: string }
    Team:
      type: object
      properties:
        team_id: { type: string }
        org_id: { type: string }
        name: { type: string, maxLength: 200 }
        status: { type: string, enum: [active, archived] }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Team' }
    CreateTeamRequest:
      type: object
      required: [org_id, name]
      properties:
        org_id: { type: string }
        name: { type: string, maxLength: 200 }
    PatchTeamRequest:
      type: object
      required: [row_version]
      description: Supply exactly one of name or status.
      properties:
        row_version: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 200 }
        status:
          type: string
          enum: [active, archived]
    TeamMembership:
      type: object
      properties:
        team_membership_id: { type: string }
        team_id: { type: string }
        user_id: { type: string }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamMembershipList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamMembership' }
    AddTeamMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
    Asset:
      type: object
      description: >-
        A Configuration Item — the operational unit every downstream
        NOC/SOC/ITSM capability references. Distinct from a Configuration
        Object (ADR-ASSET-001 §2).
      properties:
        asset_id: { type: string }
        type:
          type: string
          description: >-
            Open but validated: lower-case snake_case, e.g. server, service,
            network_device, application, database.
        name: { type: string, maxLength: 200 }
        attributes:
          type: object
          additionalProperties: true
        status: { type: string, enum: [active, retired] }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
    CreateAssetRequest:
      type: object
      required: [type, name]
      properties:
        type: { type: string }
        name: { type: string, maxLength: 200 }
        attributes:
          type: object
          additionalProperties: true
    PatchAssetRequest:
      type: object
      required: [row_version]
      description: Supply at least one of name, attributes or status.
      properties:
        row_version: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 200 }
        attributes:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [active, retired]
    AssetRelationship:
      type: object
      description: A directed, typed edge of the CMDB graph between two Assets.
      properties:
        relationship_id: { type: string }
        from_asset_id: { type: string }
        to_asset_id: { type: string }
        type: { type: string, enum: [depends_on, runs_on, connected_to, member_of] }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetRelationshipEdges:
      type: object
      description: An asset's direct (one-hop) in- and out-edges.
      properties:
        from:
          type: array
          items: { $ref: '#/components/schemas/AssetRelationship' }
        to:
          type: array
          items: { $ref: '#/components/schemas/AssetRelationship' }
    CreateAssetRelationshipRequest:
      type: object
      required: [from_asset_id, to_asset_id, type]
      properties:
        from_asset_id: { type: string }
        to_asset_id: { type: string }
        type: { type: string, enum: [depends_on, runs_on, connected_to, member_of] }
    AssetTraversalResponse:
      type: object
      description: >-
        Same shape as TraversalResponse, over the CMDB graph. Node ids are
        asset_ids rather than cfg_ids (ADR-ASSET-001 §4).
      properties:
        root: { type: string }
        direction: { type: string, enum: [dependencies, dependents] }
        recursive: { type: boolean }
        count: { type: integer }
        nodes:
          type: array
          items:
            type: object
            properties:
              asset_id: { type: string }
              depth: { type: integer }
    Setting:
      type: object
      description: >-
        `value` and `default` are rendered as the type the key's definition
        declares — a boolean for a bool setting, a number for an int setting —
        never as the string every value is stored as internally.
      properties:
        key: { type: string }
        type: { type: string, enum: [bool, int, string, enum] }
        description: { type: string }
        value: {}
        default: {}
        overridden: { type: boolean }
        row_version: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
    SettingList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Setting' }
    PutSettingRequest:
      type: object
      required: [value, row_version]
      properties:
        value: {}
        row_version:
          type: integer
          format: int64
          minimum: 0
          description: 0 to create a new override; the row_version last read to update one.
    Notification:
      type: object
      properties:
        notification_id: { type: string }
        channel: { type: string, enum: [email, webhook, inapp] }
        recipient: { type: string, maxLength: 320 }
        subject: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        status: { type: string, enum: [pending, sent, failed] }
        attempts: { type: integer }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
    AdminAuditRecord:
      type: object
      properties:
        chain_id: { type: string }
        seq: { type: integer, format: int64 }
        event_id: { type: string }
        operation: { type: string }
        actor: { type: string }
        subject_org_id: { type: string }
        subject_tenant_id: { type: string }
        subject_user_id: { type: string }
        payload_canonical:
          type: string
          format: byte
          description: The canonical bytes the chain hash was computed over.
        this_hash: { type: string, format: byte }
        occurred_at: { type: string, format: date-time }
    AdminAuditList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminAuditRecord' }
        next_cursor:
          type: string
          description: Present only when a further page exists.
    Tenant:
      type: object
      required: [tenant_id, slug, name, allowed_issuers, status, row_version, created_at, updated_at]
      properties:
        tenant_id:
          type: string
          description: Platform-minted identifier. Never supplied by the caller.
        slug:
          type: string
          description: Lowercase DNS-style label, 2-63 characters.
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        name: { type: string }
        external_id:
          type: string
          description: >-
            Identifier the identity provider asserts for this tenant (Entra tid,
            Okta org id). Bearer tokens are resolved against this, never against
            tenant_id, so the IdP can change without rewriting foreign keys.
            Empty until an identity provider is bound.
        allowed_issuers:
          type: array
          items: { type: string }
          description: >-
            Issuers (JWT iss) permitted to authenticate this tenant. An EMPTY
            array means the tenant may authenticate ONLY via the default IdP
            (ONEOPS_JWT_ISSUER) — safe by default and backward compatible. A
            tenant that brings its own additional IdP must list that issuer here;
            enforcement is fail-closed at the authentication boundary
            (ADR-IDENTITY-003).
        status:
          type: string
          enum: [active, suspended]
        row_version:
          type: integer
          format: int64
          description: Optimistic-concurrency guard.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tenant' }
    CreateTenantRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        name: { type: string }
        external_id:
          type: string
          description: Optional. Must be unique across tenants when non-empty.
        allowed_issuers:
          type: array
          items: { type: string }
          description: >-
            Optional. Issuers permitted to authenticate this tenant. Omit or
            leave empty for the safe default (default IdP only, ONEOPS_JWT_ISSUER).
            List an additional IdP's issuer to let it authenticate this tenant
            (ADR-IDENTITY-003).
    User:
      type: object
      required: [user_id, email, display_name, status, row_version, created_at, updated_at]
      properties:
        user_id:     { type: string }
        email:       { type: string, format: email }
        display_name: { type: string }
        status:
          type: string
          enum: [invited, active, suspended, deactivated]
        row_version: { type: integer, format: int64 }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email:        { type: string, format: email, maxLength: 254 }
        display_name: { type: string, maxLength: 200 }
    PatchUserRequest:
      type: object
      required: [row_version]
      description: Supply exactly one of display_name or status.
      properties:
        row_version:  { type: integer, format: int64, minimum: 1 }
        display_name: { type: string, maxLength: 200 }
        status:
          type: string
          enum: [invited, active, suspended, deactivated]
    Organization:
      type: object
      required: [org_id, tenant_id, slug, name, status, row_version, created_at, updated_at]
      properties:
        org_id:
          type: string
          description: Platform-minted identifier. Never supplied by the caller.
        tenant_id:
          type: string
          description: >-
            The tenant realising this organization's isolation boundary, 1:1 and
            enforced by constraint. It points AT the boundary rather than naming
            this row's owner. Minted server-side alongside org_id.
        slug:
          type: string
          description: Lowercase DNS-style label, 2-63 characters. Unique across organizations and tenants.
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        name: { type: string }
        status:
          type: string
          enum: [active, suspended]
        row_version: { type: integer, format: int64 }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }
    OrganizationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
    CreateOrganizationRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        name: { type: string }
    PatchOrganizationRequest:
      type: object
      required: [row_version, status]
      properties:
        row_version: { type: integer, format: int64, minimum: 1 }
        status:
          type: string
          enum: [active, suspended]
    PatchTenantRequest:
      type: object
      description: >-
        Supply a status change, or an allowed_issuers replacement. When
        allowed_issuers is present it is the operation and status is not read; an
        empty array resets the tenant to the safe default (default IdP only).
      properties:
        status:
          type: string
          enum: [active, suspended]
        allowed_issuers:
          type: array
          items: { type: string }
          description: >-
            Replacement set of issuers permitted to authenticate this tenant.
            Empty resets to the default IdP only (ADR-IDENTITY-003).
    GovernanceArchiveRequest:
      type: object
      required: [target_retention]
      properties:
        target_retention:
          type: string
          description: Archival retention class to set.
          enum: [historical_record, historical_evidence, audit_record, superseded_plan]
    GovernanceState:
      type: object
      properties:
        lifecycle: { type: string }
        retention_class: { type: string }
        authority: { type: string }
    GovernanceAudit:
      type: object
      description: Read-only audit metadata; exposes no internal hashes or event ids.
      properties:
        operation_id: { type: string }
        chain_id: { type: string }
        recorded: { type: boolean }
    GovernanceResponse:
      type: object
      properties:
        operation: { type: string }
        cfg_id: { type: string }
        actor: { type: string }
        occurred_at: { type: string, format: date-time }
        removed: { type: boolean }
        row_version: { type: integer, format: int64 }
        state: { $ref: '#/components/schemas/GovernanceState' }
        audit: { $ref: '#/components/schemas/GovernanceAudit' }
        approvals: { $ref: '#/components/schemas/GovernanceApprovalStatus' }
    GovernanceApprovalStatus:
      type: object
      description: >
        Multi-approver quorum status (ADR-GOV-005). Present only on the
        response to POST .../approve. met is false, and the sibling state
        field's lifecycle is unchanged, until count >= required.
      properties:
        count: { type: integer, description: Distinct approvers recorded so far, including this call. }
        required: { type: integer, description: The tenant's configured governance_required_approvals. }
        met: { type: boolean }
        summary: { type: string, example: "approvals: 1 of required 2" }
    GovernanceApprover:
      type: object
      properties:
        approver_user_id: { type: string }
        approved_at: { type: string, format: date-time }
    GovernanceApprovalsResponse:
      type: object
      description: Who has recorded a distinct approval of a governance object so far, against its tenant's configured quorum (ADR-GOV-005).
      properties:
        cfg_id: { type: string }
        approvers:
          type: array
          items: { $ref: '#/components/schemas/GovernanceApprover' }
        count: { type: integer }
        required: { type: integer }
        met: { type: boolean }
    GovernanceStateResponse:
      type: object
      properties:
        cfg_id: { type: string }
        lifecycle: { type: string }
        retention_class: { type: string }
        retention_policy: { type: string }
        authority: { type: string }
        row_version: { type: integer, format: int64 }
        ratified_by: { type: string }
        review_cycle: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GovernanceHistoryItem:
      type: object
      properties:
        seq: { type: integer, format: int64 }
        operation: { type: string }
        actor: { type: string }
        occurred_at: { type: string, format: date-time }
        operation_id: { type: string }
        removed: { type: boolean }
        resulting_state: { $ref: '#/components/schemas/GovernanceState' }
    GovernanceHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GovernanceHistoryItem' }
        next_cursor: { type: string }
    AuditChainResponse:
      type: object
      description: Chain summary and verification status; no hashing internals exposed.
      properties:
        chain_id: { type: string }
        verified: { type: boolean }
        checked: { type: integer, format: int64 }
        head_seq: { type: integer, format: int64 }
        head_hash: { type: string, description: Hex-encoded chain head hash. }
        first_break_seq: { type: integer, format: int64 }
        break_reason: { type: string }
    AuditEventItem:
      type: object
      properties:
        seq: { type: integer, format: int64 }
        event_id: { type: string }
        operation_id: { type: string }
        operation: { type: string }
        actor: { type: string }
        occurred_at: { type: string, format: date-time }
        prev_hash: { type: string }
        this_hash: { type: string }
    AuditEventsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEventItem' }
        order: { type: string, enum: [asc, desc] }
        next_cursor: { type: string }
    VerificationResponse:
      type: object
      properties:
        chain_id: { type: string }
        integrity_ok: { type: boolean }
        checked: { type: integer, format: int64 }
        first_break_seq: { type: integer, format: int64 }
        break_reason: { type: string }
        scheduler:
          type: object
          properties:
            enabled: { type: boolean }
            has_run: { type: boolean }
            running: { type: boolean }
            last_run_at: { type: string, format: date-time }
            last_healthy: { type: boolean }
            stalled: { type: boolean }
            failures: { type: integer }
            errors: { type: integer }
    AdminSchedulerStatus:
      type: object
      properties:
        running: { type: boolean }
        has_run: { type: boolean }
        interval_seconds: { type: number }
        last_run_at: { type: string, format: date-time }
        stalled: { type: boolean }
        last_healthy: { type: boolean }
        chains_total: { type: integer }
        chains_ok: { type: integer }
        failures: { type: integer }
        errors: { type: integer }
    AdminDependency:
      type: object
      properties:
        name: { type: string }
        up: { type: boolean }
        error: { type: string }
    AdminStatusResponse:
      type: object
      properties:
        service: { type: string }
        version: { type: string }
        commit: { type: string }
        build_time: { type: string }
        env: { type: string }
        uptime_seconds: { type: number }
        migration_version: { type: string }
        scheduler: { $ref: '#/components/schemas/AdminSchedulerStatus' }
        verifier_healthy: { type: boolean }
        dependencies:
          type: array
          items: { $ref: '#/components/schemas/AdminDependency' }
        healthy: { type: boolean }
    AdminIntegrityResponse:
      type: object
      properties:
        enabled: { type: boolean }
        running: { type: boolean }
        has_run: { type: boolean }
        last_run_at: { type: string, format: date-time }
        last_healthy: { type: boolean }
        stalled: { type: boolean }
        chains_total: { type: integer }
        chains_ok: { type: integer }
        failures: { type: integer }
        errors: { type: integer }
    AdminIntegrityRun:
      type: object
      properties:
        started_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        chains_total: { type: integer }
        chains_ok: { type: integer }
        failures: { type: integer }
        errors: { type: integer }
        healthy: { type: boolean }
    AdminMetricsResponse:
      type: object
      properties:
        counters:
          type: object
          additionalProperties: { type: number }
    AdminConfigResponse:
      type: object
      properties:
        modules:
          type: object
          additionalProperties: { type: boolean }
        config:
          type: object
          description: Redacted runtime configuration (no secrets).
    AdminReportResponse:
      type: object
      properties:
        diagnostics: { type: object, description: Operational diagnostics snapshot. }
        metrics:
          type: object
          additionalProperties: { type: number }
    Webhook:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        enabled: { type: boolean }
        operations: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }
        max_retries: { type: integer }
        secret: { type: string, description: Returned only on create and secret rotation. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Webhook' } }
    CreateWebhookRequest:
      type: object
      required: [url]
      properties:
        url: { type: string }
        enabled: { type: boolean }
        operations: { type: array, items: { type: string }, description: Empty means all operations. }
        resources: { type: array, items: { type: string }, description: Empty means all resources. }
        max_retries: { type: integer }
    PatchWebhookRequest:
      type: object
      properties:
        url: { type: string }
        enabled: { type: boolean }
        operations: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }
        max_retries: { type: integer }
        rotate_secret: { type: boolean }
    WebhookTestResult:
      type: object
      properties:
        status: { type: string, enum: [pending, delivered, failed, dead_letter] }
        error: { type: string }
    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        webhook_id: { type: string }
        operation: { type: string }
        cfg_id: { type: string }
        seq: { type: integer, format: int64 }
        status: { type: string, enum: [pending, delivered, failed, dead_letter] }
        retry_count: { type: integer }
        last_status_code: { type: integer }
        last_attempt: { type: string, format: date-time }
        next_attempt_at: { type: string, format: date-time }
    WebhookDeliveryList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }
    ReplayRequest:
      type: object
      description: Time window OR delivery ids; both empty replays the full committed history.
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        delivery_ids: { type: array, items: { type: string } }
    ReplayJob:
      type: object
      properties:
        id: { type: string }
        webhook_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        delivery_ids: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, running, completed, failed] }
        events_replayed: { type: integer }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReplayJobList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReplayJob' } }
    DeliveryDetail:
      type: object
      properties:
        id: { type: string }
        webhook_id: { type: string }
        operation: { type: string }
        cfg_id: { type: string }
        seq: { type: integer, format: int64 }
        status: { type: string }
        attempts: { type: integer }
        last_status_code: { type: integer }
        last_attempt: { type: string, format: date-time }
        next_attempt_at: { type: string, format: date-time }
        headers: { type: object, additionalProperties: { type: string } }
        payload: { type: object, description: Canonical delivery payload (rebuilt from committed data). }
    RequeueResult:
      type: object
      properties:
        requeued: { type: integer }
    PolicyCondition:
      type: object
      properties:
        operations: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }
        actors: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: { type: string } }
    PolicyAction:
      type: object
      properties:
        type: { type: string, enum: [http, email, command, notification] }
        config: { type: object }
    PolicyGate:
      type: object
      description: >-
        The Decision that must resolve before a composed Sequence advances
        past the step it guards (ADR-POLICY-001/002). Only "approval" is
        evaluated today; any other type is left pending, never guessed at.
      required: [type]
      properties:
        type: { type: string }
        config: { type: object }
    PolicyStep:
      type: object
      description: One step of a Policy's composed Sequence.
      required: [action]
      properties:
        action: { $ref: '#/components/schemas/PolicyAction' }
        gate: { $ref: '#/components/schemas/PolicyGate' }
    Policy:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        condition: { $ref: '#/components/schemas/PolicyCondition' }
        action: { $ref: '#/components/schemas/PolicyAction' }
        steps:
          type: array
          description: >-
            Ordered, optionally gated Sequence of Actions (ADR-POLICY-001).
            Empty/absent means "use action as the whole response".
          items: { $ref: '#/components/schemas/PolicyStep' }
        max_retries: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PolicyList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Policy' } }
    CreatePolicyRequest:
      type: object
      required: [name, action]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        condition: { $ref: '#/components/schemas/PolicyCondition' }
        action: { $ref: '#/components/schemas/PolicyAction' }
        steps: { type: array, items: { $ref: '#/components/schemas/PolicyStep' } }
        max_retries: { type: integer }
    PatchPolicyRequest:
      type: object
      properties:
        name: { type: string }
        enabled: { type: boolean }
        condition: { $ref: '#/components/schemas/PolicyCondition' }
        action: { $ref: '#/components/schemas/PolicyAction' }
        steps: { type: array, items: { $ref: '#/components/schemas/PolicyStep' } }
        max_retries: { type: integer }
    PolicyExecution:
      type: object
      properties:
        id: { type: string }
        policy_id: { type: string }
        event_id: { type: string }
        operation: { type: string }
        cfg_id: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, dead_letter] }
        retry_count: { type: integer }
        error: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        run_id: { type: string, description: "Composed-run id (ADR-POLICY-001); empty for a single-action execution. Pass to GET /admin/policies/{id}/runs/{runId}." }
        step_index: { type: integer, description: "Step position within a composed run." }
        gate: { type: string, enum: ["", pending, passed], description: "This step's Decision gate state." }
    PolicyExecutionList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PolicyExecution' } }
    PolicyTestResult:
      type: object
      properties:
        status: { type: string }
        error: { type: string }
    PolicyRunStep:
      type: object
      properties:
        index: { type: integer }
        status: { type: string, enum: [pending, running, succeeded, failed, dead_letter] }
        gate: { type: string, enum: [none, pending, passed] }
        execution_id: { type: string }
        error: { type: string }
    PolicyRun:
      type: object
      description: >-
        A composed run's progress — a pure projection over its Execution rows
        (ADR-POLICY-001), never a stored entity.
      properties:
        run_id: { type: string }
        policy_id: { type: string }
        steps: { type: array, items: { $ref: '#/components/schemas/PolicyRunStep' } }
        current_step: { type: integer }
        complete: { type: boolean }
        paused_at_gate: { type: boolean }
    TimelineEntry:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        component: { type: string, enum: [governance, audit, webhook, replay, policy] }
        action: { type: string }
        status: { type: string }
        duration_ms: { type: integer, format: int64 }
        correlation: { type: object, additionalProperties: { type: string } }
        metadata: { type: object, additionalProperties: { type: string } }
    TimelinePage:
      type: object
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
        next_offset: { type: string }
    ComplianceCheck:
      type: object
      properties:
        id: { type: string }
        description: { type: string }
        passed: { type: boolean }
        detail: { type: string }
    ComplianceCheckList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ComplianceCheck' } }
    ComplianceSummary:
      type: object
      properties:
        governance_id: { type: string }
        lifecycle: { type: string }
        verified: { type: boolean }
        compliant: { type: boolean }
        checks_passed: { type: integer }
        checks_total: { type: integer }
        generated_at: { type: string, format: date-time }
    ComplianceReportPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ComplianceSummary' } }
        next_cursor: { type: string }
    Evidence:
      type: object
      description: Immutable evidence bundle composed from existing persisted data.
      properties:
        governance_id: { type: string }
        generated_at: { type: string, format: date-time }
        governance: { type: object }
        integrity: { type: object }
        timeline: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
        webhooks: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
        replays: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
        policies: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
        correlation_ids: { type: array, items: { type: string } }
        checks: { type: array, items: { $ref: '#/components/schemas/ComplianceCheck' } }
        compliant: { type: boolean }
    Role:
      type: string
      enum: [constitution, governance, eng_spec, validation, evidence, audit, planning, reference, working]
    Lifecycle:
      type: string
      enum: [draft, in_review, ratified, approved, in_progress, complete, suspended, deprecated, withdrawn]
    Authority:
      type: string
      enum: [active, historical, non_normative]
    RetentionClass:
      type: string
      enum: [current_baseline, current_planning, historical_record, superseded_planning, historical_evidence, audit_record, working_material]
    CreateRequest:
      type: object
      description: >
        Creates a Configuration Object in its inception state (INT-3): lifecycle
        must be draft or in_progress, and retention_class must be
        working_material. Every other state is reached through a §8 governance
        operation. Authority is not accepted — it is a computed field (§6) and
        is assigned by the platform.
      required: [artifact, version, role, lifecycle, retention_class]
      properties:
        artifact: { type: string }
        version: { type: string, example: "1.0.0" }
        role: { $ref: '#/components/schemas/Role' }
        lifecycle:
          type: string
          enum: [draft, in_progress]
          description: Inception lifecycle only (INT-3).
        retention_class:
          type: string
          enum: [working_material]
          description: Inception retention only (INT-3).
        ratified_by: { type: string }
        review_cycle: { type: string }
        retention_policy: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
    PatchRequest:
      type: object
      description: >
        Non-constitutional fields only. Lifecycle, retention_class and authority
        cannot be patched: §8 permits no dimension change except through a
        governance operation, and authority is computed (§6). The metadata keys
        responsibilities, citations and coverage are §9.1 inputs and are
        rejected here.
      properties:
        ratified_by: { type: string }
        review_cycle: { type: string }
        retention_policy: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
    ConfigObject:
      type: object
      properties:
        cfg_id: { type: string }
        artifact: { type: string }
        version: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        retention_class: { $ref: '#/components/schemas/RetentionClass' }
        authority: { $ref: '#/components/schemas/Authority' }
        ratified_by: { type: string }
        review_cycle: { type: string }
        retention_policy: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigObject' }
        next_cursor: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    GraphNode:
      type: object
      description: A reachable graph node. Graph primitive only — no authority/lifecycle.
      properties:
        cfg_id: { type: string }
        depth: { type: integer, description: Minimum hop distance from the root (direct = 1). }
    TraversalResponse:
      type: object
      properties:
        root: { type: string }
        direction: { type: string, enum: [dependencies, dependents] }
        recursive: { type: boolean }
        count: { type: integer }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/GraphNode' }
    CyclePath:
      type: object
      properties:
        path:
          type: array
          description: A closed cycle path; first and last node ids are identical.
          items: { type: string }
    CyclesResponse:
      type: object
      properties:
        root: { type: string }
        count: { type: integer }
        cycles:
          type: array
          items: { $ref: '#/components/schemas/CyclePath' }
