        '201':
          description: Created tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/tenants/{id}:
    patch:
      summary: Suspend or reactivate a tenant
      description: >-
        Suspension is the only mutation the registry exposes. A tenant is never
        deleted: its audit history is append-only by constitutional guarantee,
        so removing the tenant would orphan records that cannot be removed. The
        system tenant cannot be suspended — doing so would lock the platform out
        of every row written before tenancy existed.
      operationId: patchTenant
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchTenantRequest' } } }
      responses:
        '200':
          description: Updated tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/policies:
