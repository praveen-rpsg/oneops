    ComplianceCheck:
      type: object
      properties:
        id: { type: string }
        description: { type: string }
        passed: { type: boolean }
        detail: { type: string }
    ComplianceCheckList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ComplianceCheck' } }
    ComplianceSummary:
      type: object
      properties:
        governance_id: { type: string }
        lifecycle: { type: string }
        verified: { type: boolean }
        compliant: { type: boolean }
        checks_passed: { type: integer }
        checks_total: { type: integer }
        generated_at: { type: string, format: date-time }
    ComplianceReportPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ComplianceSummary' } }
        next_cursor: { type: string }
    Evidence:
      type: object
      description: Immutable evidence bundle composed from existing persisted data.
      properties:
        governance_id: { type: string }
        generated_at: { type: string, format: date-time }
        governance: { type: object }
        integrity: { type: object }
        timeline: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
        webhooks: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
        replays: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
        policies: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
        correlation_ids: { type: array, items: { type: string } }
        checks: { type: array, items: { $ref: '#/components/schemas/ComplianceCheck' } }
        compliant: { type: boolean }
    Role:
      type: string
      enum: [constitution, governance, eng_spec, validation, evidence, audit, planning, reference, working]
    Lifecycle:
      type: string
      enum: [draft, in_review, ratified, approved, in_progress, complete, suspended, deprecated, withdrawn]
    Authority:
      type: string
      enum: [active, historical, non_normative]
    RetentionClass:
      type: string
      enum: [current_baseline, current_planning, historical_record, superseded_planning, historical_evidence, audit_record, working_material]
    CreateRequest:
      type: object
      required: [artifact, version, role, lifecycle, retention_class]
      properties:
        artifact: { type: string }
        version: { type: string, example: "1.0.0" }
        role: { $ref: '#/components/schemas/Role' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        retention_class: { $ref: '#/components/schemas/RetentionClass' }
        authority: { $ref: '#/components/schemas/Authority' }
        ratified_by: { type: string }
        review_cycle: { type: string }
        retention_policy: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
    PatchRequest:
      type: object
      properties:
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        retention_class: { $ref: '#/components/schemas/RetentionClass' }
        authority: { $ref: '#/components/schemas/Authority' }
        ratified_by: { type: string }
        review_cycle: { type: string }
        retention_policy: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
    ConfigObject:
      type: object
      properties:
        cfg_id: { type: string }
        artifact: { type: string }
        version: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        retention_class: { $ref: '#/components/schemas/RetentionClass' }
        authority: { $ref: '#/components/schemas/Authority' }
        ratified_by: { type: string }
        review_cycle: { type: string }
        retention_policy: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigObject' }
        next_cursor: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    GraphNode:
      type: object
      description: A reachable graph node. Graph primitive only — no authority/lifecycle.
      properties:
        cfg_id: { type: string }
        depth: { type: integer, description: Minimum hop distance from the root (direct = 1). }
    TraversalResponse:
      type: object
      properties:
        root: { type: string }
        direction: { type: string, enum: [dependencies, dependents] }
        recursive: { type: boolean }
        count: { type: integer }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/GraphNode' }
    CyclePath:
      type: object
      properties:
        path:
          type: array
          description: A closed cycle path; first and last node ids are identical.
          items: { type: string }
    CyclesResponse:
      type: object
      properties:
        root: { type: string }
        count: { type: integer }
        cycles:
          type: array
          items: { $ref: '#/components/schemas/CyclePath' }
