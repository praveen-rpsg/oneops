openapi: 3.0.3
info:
  title: OneOps Configuration Registry API
  version: "1.0.0"
  description: >
    The system of record for OneOps artifacts (Configuration State Model §6).
    Authority is a maintained projection computed from the dependency graph (M3).
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /v1/artifacts:
    get:
      summary: List configuration objects (keyset pagination)
      operationId: listArtifacts
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: lifecycle, in: query, schema: { $ref: '#/components/schemas/Lifecycle' } }
        - { name: authority, in: query, schema: { $ref: '#/components/schemas/Authority' } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of configuration objects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create a configuration object
      operationId: createArtifact
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { schema: { type: string } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigObject' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/artifacts/bulk:
    post:
      summary: Bulk-create configuration objects (atomic)
      operationId: bulkCreateArtifacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/CreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/artifacts/{id}:
    get:
      summary: Get a configuration object
      operationId: getArtifact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: The object
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigObject' }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Partially update a configuration object (optimistic locking)
      operationId: patchArtifact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchRequest' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigObject' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a working-material configuration object
      description: >
        Destroying a Configuration Object is a §8 constitutional operation and is
        executed by the Governance Engine, identically to
        DELETE /v1/governance/{id}: deletion is permitted only for
        working_material with no dependents, protected roles are never deletable,
        and the removal is recorded in the object's audit chain.


        Breaking change (ADR-GOV-002): this route previously performed an
        unaudited delete that enforced only the protected-role rule. It now
        requires an Idempotency-Key, returns 200 with the governance result
        instead of 204, and returns 409 where it formerly destroyed a governed
        object.
      operationId: deleteArtifact
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { $ref: '#/components/responses/GovernanceResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/configurations/{cfgId}/dependencies:
    get:
      summary: Dependencies of a configuration object (forward graph)
      description: >
        Direct dependencies by default; the transitive forward closure when
        recursive=true. Graph primitives only — no authority or lifecycle.
      operationId: getDependencies
      security:
        - bearerAuth: []
      parameters:
        - { name: cfgId, in: path, required: true, schema: { type: string } }
        - { name: recursive, in: query, schema: { type: boolean, default: false } }
        - { name: max_depth, in: query, schema: { type: integer, minimum: 1 }, description: Cap recursive depth. }
      responses:
        '200':
          description: Reachable dependency nodes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraversalResponse' }
              example:
                root: "01J000000000000000000ROOT"
                direction: dependencies
                recursive: true
                count: 2
                nodes:
                  - { cfg_id: "01J0000000000000000000BBB", depth: 1 }
                  - { cfg_id: "01J0000000000000000000CCC", depth: 2 }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/configurations/{cfgId}/dependents:
    get:
      summary: Dependents of a configuration object (reverse graph)
      description: >
        Direct dependents by default; the transitive reverse closure when
        recursive=true. Graph primitives only — no authority or lifecycle.
      operationId: getDependents
      security:
        - bearerAuth: []
      parameters:
        - { name: cfgId, in: path, required: true, schema: { type: string } }
        - { name: recursive, in: query, schema: { type: boolean, default: false } }
        - { name: max_depth, in: query, schema: { type: integer, minimum: 1 }, description: Cap recursive depth. }
      responses:
        '200':
          description: Reachable dependent nodes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraversalResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/configurations/{cfgId}/cycles:
    get:
      summary: Cycles reachable from a configuration object
      description: >
        Dependency cycles reachable from cfgId, each as a closed path. Returns an
        empty list when none exist. Cycles are detected, never repaired.
      operationId: getCycles
      security:
        - bearerAuth: []
      parameters:
        - { name: cfgId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Detected cycles (possibly empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CyclesResponse' }
              example:
                root: "01J000000000000000000ROOT"
                count: 1
                cycles:
                  - { path: ["01J...A", "01J...B", "01J...A"] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  # Governance — constitutional operations (Configuration State Model §8). Each
  # POST applies exactly one operation atomically with its audit event
  # (ADR-AUDIT-005). Idempotency-Key is required; If-Match enables optimistic
  # concurrency. All rules are enforced by the Governance Engine.
  /v1/governance/{id}/ratify:
    post:
      summary: Ratify a configuration object
      operationId: ratifyGovernance
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { $ref: '#/components/responses/GovernanceResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/governance/{id}/approve:
    post:
      summary: Approve a configuration object
      operationId: approveGovernance
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { $ref: '#/components/responses/GovernanceResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/governance/{id}/extend:
    post:
      summary: Record that a successor extends this configuration object
      description: >
        Configuration State Model §8 Extension. The successor depends on or
        inherits this object; this object's dimensions are UNCHANGED — in
        particular its Authority is not demoted. Extension is not Replacement.
      operationId: extendGovernance
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [successor_id]
              properties:
                successor_id:
                  type: string
                  description: The configuration object that extends this one.
      responses:
        '200': { $ref: '#/components/responses/GovernanceResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/governance/{id}/replace:
    post:
      summary: Supersede this configuration object with a successor
      description: >
        Configuration State Model §8 Replacement. Gated by the four-part
        Replacement Test (§9.1): the successor must own every responsibility of
        the base, no Active artifact may cite the base, no Active configuration
        may depend on it, and its removal must leave no operational gap. On
        success the base moves to Authority=historical and
        Retention=historical_record, and a supersedes edge is recorded. A failed
        test returns 409 naming the clause that failed.
      operationId: replaceGovernance
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [successor_id]
              properties:
                successor_id:
                  type: string
                  description: The configuration object that supersedes this one.
      responses:
        '200': { $ref: '#/components/responses/GovernanceResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/governance/{id}/suspend:
    post:
      summary: Suspend a configuration object
      operationId: suspendGovernance
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { $ref: '#/components/responses/GovernanceResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/governance/{id}/deprecate:
    post:
      summary: Deprecate a configuration object
      operationId: deprecateGovernance
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { $ref: '#/components/responses/GovernanceResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/governance/{id}/withdraw:
    post:
      summary: Withdraw a configuration object
      operationId: withdrawGovernance
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { $ref: '#/components/responses/GovernanceResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/governance/{id}/archive:
    post:
      summary: Archive a configuration object into an archival retention class
      operationId: archiveGovernance
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GovernanceArchiveRequest' }
      responses:
        '200': { $ref: '#/components/responses/GovernanceResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/governance/{id}:
    get:
      summary: Current governance state of a configuration object
      operationId: getGovernanceState
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
      responses:
        '200':
          description: Current governance state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernanceStateResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a working-material configuration object
      description: >
        Deletion is permitted only for working_material with no dependents; the
        engine enforces both. The audit chain for the object is preserved.
      operationId: deleteGovernance
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { $ref: '#/components/responses/GovernanceResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  # Governance — read-only query APIs (state / history / audit / verification).
  /v1/governance/{id}/history:
    get:
      summary: Chronological governance operation history
      operationId: getGovernanceHistory
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/OperationFilter' }
      responses:
        '200':
          description: Governance history page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernanceHistoryResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/governance/{id}/audit:
    get:
      summary: Audit chain summary and verification status
      operationId: getAuditChain
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
      responses:
        '200':
          description: Audit chain summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditChainResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/governance/{id}/audit/events:
    get:
      summary: Audit event metadata (paged, ordered, filterable)
      operationId: getAuditEvents
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Order' }
        - { $ref: '#/components/parameters/OperationFilter' }
      responses:
        '200':
          description: Audit events page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventsResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/governance/{id}/verification:
    get:
      summary: Per-object integrity and latest scheduler result
      operationId: getVerification
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
      responses:
        '200':
          description: Verification status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/governance/{id}/approvals:
    get:
      summary: Who has approved this configuration object so far (ADR-GOV-005)
      description: >
        Multi-approver quorum status: every distinct approval recorded for
        this object against the tenant's configured
        governance_required_approvals threshold. Read-only; recording an
        approval is POST .../approve.
      operationId: getGovernanceApprovals
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/GovId' }
      responses:
        '200':
          description: Approval quorum status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernanceApprovalsResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  # Administration & Operations — read-only except the explicit integrity run.
  # All require admin permission. No constitutional behavior is exposed here.
  /v1/admin/status:
    get:
      summary: Platform status (reuses diagnostics)
      operationId: adminStatus
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Platform status
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStatusResponse' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/integrity:
    get:
      summary: Integrity/scheduler summary
      operationId: adminIntegrity
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Integrity summary
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminIntegrityResponse' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/integrity/run:
    post:
      summary: Trigger one verification sweep (reuses the existing scheduler)
      operationId: adminIntegrityRun
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Sweep result
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminIntegrityRun' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/metrics:
    get:
      summary: Summarized operational counters (derived from /metrics)
      operationId: adminMetrics
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Metrics summary
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminMetricsResponse' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/config:
    get:
      summary: Redacted runtime configuration and enabled modules
      operationId: adminConfig
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Configuration summary (no secrets)
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfigResponse' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/report:
    get:
      summary: Combined operational report (diagnostics + metrics)
      operationId: adminReport
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Operational report
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminReportResponse' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  # Event delivery — webhook administration (admin permission). Governance events
  # are relayed to registered webhooks after the committed operation, signed with
  # HMAC-SHA256. Secrets are returned only on create and secret rotation.
  /v1/admin/webhooks:
    get:
      summary: List webhooks (secrets redacted)
      operationId: listWebhooks
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Webhooks
          content: { application/json: { schema: { $ref: '#/components/schemas/WebhookList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create a webhook (response includes the generated secret)
      operationId: createWebhook
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateWebhookRequest' } } }
      responses:
        '201':
          description: Created webhook (secret revealed once)
          content: { application/json: { schema: { $ref: '#/components/schemas/Webhook' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/webhooks/{id}:
    patch:
      summary: Update a webhook (enable/disable, filters, secret rotation)
      operationId: patchWebhook
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchWebhookRequest' } } }
      responses:
        '200':
          description: Updated webhook (secret revealed only if rotated)
          content: { application/json: { schema: { $ref: '#/components/schemas/Webhook' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a webhook
      operationId: deleteWebhook
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/webhooks/{id}/test:
    post:
      summary: Deliver one synthetic event to a webhook and report the result
      operationId: testWebhook
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Test delivery result
          content: { application/json: { schema: { $ref: '#/components/schemas/WebhookTestResult' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/webhooks/{id}/deliveries:
    get:
      summary: List a webhook's recent deliveries
      operationId: listWebhookDeliveries
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Deliveries
          content: { application/json: { schema: { $ref: '#/components/schemas/WebhookDeliveryList' } } }
        '404': { $ref: '#/components/responses/Problem' }

  # Event consumption & replay (admin). Replay operates only on committed
  # audit-derived events; it never regenerates events.
  /v1/admin/webhooks/{id}/replay:
    post:
      summary: Replay committed events to a webhook (async job)
      operationId: replayWebhook
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplayRequest' } } }
      responses:
        '202':
          description: Replay job accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplayJob' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/webhooks/{id}/deliveries/{deliveryID}:
    get:
      summary: Inspect a delivery (payload, headers, attempts, status)
      operationId: getDelivery
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: deliveryID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Delivery detail
          content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryDetail' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/webhooks/{id}/deliveries/{deliveryID}/retry:
    post:
      summary: Re-queue a single delivery (reuses the dispatcher)
      operationId: retryDelivery
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: deliveryID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Requeued
          content: { application/json: { schema: { $ref: '#/components/schemas/RequeueResult' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/webhooks/deadletters:
    get:
      summary: List dead-letter deliveries
      operationId: listDeadLetters
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: webhook_id, in: query, required: false, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Dead-letter deliveries
          content: { application/json: { schema: { $ref: '#/components/schemas/WebhookDeliveryList' } } }
  /v1/admin/webhooks/deadletters/retry:
    post:
      summary: Re-queue dead-letter deliveries (reuses the dispatcher)
      operationId: retryDeadLetters
      security: [ { bearerAuth: [] } ]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { webhook_id: { type: string } } } } }
      responses:
        '200':
          description: Requeued
          content: { application/json: { schema: { $ref: '#/components/schemas/RequeueResult' } } }
  /v1/admin/webhooks/replay/jobs:
    get:
      summary: List replay jobs
      operationId: listReplayJobs
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Replay jobs
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplayJobList' } } }
  /v1/admin/webhooks/replay/jobs/{jobID}:
    get:
      summary: Get a replay job
      operationId: getReplayJob
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Replay job
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplayJob' } } }
        '404': { $ref: '#/components/responses/Problem' }

  # Policy automation (admin). Policies react to committed governance events; they
  # never participate in governance execution.
  /v1/admin/users:
    get:
      summary: List users, or resolve one by email address
      description: >-
        Users are global to the platform: a person exists before, and
        independently of, any membership (ADR-IDENTITY-001 §8.2), so this
        collection is not scoped to a tenant and administering it is a platform
        operation. Supplying `email` resolves a single address and returns a
        list of zero or one — the collection exists whether or not anything in
        it matched, so a filter that finds nothing is an empty page, not a 404.
        Paging is keyset over `user_id`, which is a ULID and therefore ordered
        by creation; `limit` is clamped so an unbounded request cannot hand the
        whole table to one caller.
      operationId: listUsers
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: email
          in: query
          description: Resolve a single user by address, case-insensitively.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
        - name: after
          in: query
          description: Keyset cursor — the last user_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of users
          content: { application/json: { schema: { $ref: '#/components/schemas/UserList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Register a user
      description: >-
        The user starts `invited` and holds no access until a membership grants
        it. The identifier is minted server-side and is not accepted from the
        caller. The address is unique platform-wide and compared
        case-insensitively, so a differently cased duplicate is a conflict
        rather than a second account for the same person.
      operationId: createUser
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } }
      responses:
        '201':
          description: Created user
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/users/{id}:
    get:
      summary: Get a user
      operationId: getUser
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The user
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Change a display name, or perform a lifecycle transition
      description: >-
        Exactly one of `display_name` or `status` per call. The two follow
        different paths — a status change is checked against the lifecycle, a
        rename is not — and a request doing both would consume two row versions
        and leave the outcome of one of them unreported.


        `row_version` is required and is the version last read for this user. A
        stale value is a 409: the record changed underneath the caller, who must
        re-read before deciding again.


        A refused transition is also a 409, not a 422: the target state is
        well-formed, it is the move that is not allowed. Deactivation is
        terminal — the row is retained so audit events keep an attributable
        author (ADR-IDENTITY-001 §8.3).
      operationId: patchUser
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchUserRequest' } } }
      responses:
        '200':
          description: Updated user
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/audit/events:
    get:
      summary: Query administrative audit history
      description: >-
        The constitutional read boundary for administrative audit
        (ADR-AUDIT-007 §6.5). Administrative acts — user, organization,
        membership, invitation and tenant mutations — are recorded on a store
        separate from the constitutional audit chain, are never delivered to
        webhook subscribers, and are readable only here and only by platform
        administrators. The store is deliberately outside row-level security
        (§6.4), so this middleware and the privileged database role behind it
        are the isolation.
        Ordering is newest first over (occurred_at, chain_id, seq). That tuple
        is a total order — occurred_at alone is not unique, because one
        administrative act can write sibling records on the same timestamp — so
        the keyset cursor can neither skip a row nor repeat one. `payload_canonical`
        is the exact byte sequence the chain hash was computed over, so a caller
        can verify a record rather than trust this rendering of it.
      operationId: listAdminAuditEvents
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: actor
          in: query
          description: Who performed the act.
          schema: { type: string }
        - name: operation
          in: query
          description: What was done, e.g. `user.created`.
          schema: { type: string }
        - name: subject_org_id
          in: query
          description: The organization acted upon.
          schema: { type: string }
        - name: subject_tenant_id
          in: query
          description: The tenant acted upon.
          schema: { type: string }
        - name: subject_user_id
          in: query
          description: The user acted upon.
          schema: { type: string }
        - name: from
          in: query
          description: Inclusive lower bound on occurred_at, RFC 3339.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Inclusive upper bound on occurred_at, RFC 3339.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Opaque keyset cursor returned as next_cursor by the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of administrative audit records
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminAuditList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/memberships:
    get:
      summary: List an organization's memberships
      description: >-
        Membership is tenant-owned and under row-level security, so the result
        is confined to the caller's tenant by the database rather than by a
        predicate. An org_id belonging to another tenant returns an empty page,
        not a refusal: the rows are invisible, and invisible is deliberately
        indistinguishable from absent. Paging is keyset over `membership_id`,
        which is a ULID and therefore ordered by creation.
      operationId: listMemberships
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: org_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last membership_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of memberships
          content: { application/json: { schema: { $ref: '#/components/schemas/MembershipList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Grant a membership
      description: >-
        Binds a user to an organization. The tenant is taken from the bound
        connection and never from the request, so a caller cannot plant a
        membership inside another boundary. Re-granting a revoked membership
        reactivates it rather than creating a second row; an already-active
        membership is returned unchanged. Every grant writes an administrative
        audit record in the same transaction (ADR-AUDIT-007 §6.9).
      operationId: grantMembership
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantMembershipRequest' }
      responses:
        '201':
          description: The membership
          content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/memberships/{id}:
    delete:
      summary: Revoke a membership
      description: >-
        Withdraws a membership. The row is NOT deleted — revocation is a state
        change, so the administrative record of the grant keeps a subject to
        point at (ADR-IDENTITY-001 §8.3) — and the revoked membership is
        returned rather than an empty response so the caller can see that. Safe
        to call twice: an already-revoked membership is a conflict, not a second
        revocation. Writes an administrative audit record in the same
        transaction.
      operationId: revokeMembership
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The revoked membership
          content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/tenant-users:
    get:
      summary: List the CALLER'S OWN tenant's active members (read-only projection)
      description: >-
        Unlike GET /admin/users (the platform-wide registry, requirePlatformAdmin),
        this reads membership — a TENANT-OWNED, row-level-secured table — joined
        to the global app_user table for display, exactly the join
        OnCallScheduleRepository.OnCall already performs for on-call
        display_name (ADR-ACT-003). Tenant isolation is row-level security
        alone: no explicit tenant predicate, no privileged pool, identical to
        GET /admin/noc/overview and GET /admin/assets/graph. "Active member"
        requires BOTH an active membership row AND an app_user account that
        has not been suspended or deactivated; membership itself has no
        "suspended" state (only active/revoked). Paging is keyset over
        user_id, which is a ULID and therefore globally ordered and unique
        per person — a user can hold at most one membership per organization.
      operationId: listTenantUsers
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last user_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of the caller's own tenant's active members
          content: { application/json: { schema: { $ref: '#/components/schemas/TenantUserList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/tenant-org:
    get:
      summary: Get the CALLER'S OWN tenant's organization
      description: >-
        Membership and team administration require an org_id, and a
        tenant-admin session otherwise has no way to discover it except an
        operator reading a ULID out of the database to them. Organization is
        global and outside row-level security (ADR-IDENTITY-002 §3.1), so —
        unlike GET /admin/tenant-users — this route is itself the only
        isolation control in front of it: the tenant is resolved strictly
        from the authenticated context, never a request parameter, so a
        caller receives only their own tenant's organization. The 1:1
        between organization and tenant (uq_org_tenant, ADR-IDENTITY-001 §4)
        makes the result single-valued.
      operationId: getTenantOrganization
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: The caller's own tenant's organization
          content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/invitations:
    get:
      summary: List the CALLER'S OWN organization's pending invitations
      description: >-
        Invitation is tenant-owned and under row-level security, exactly like
        membership, so the result is confined to the caller's tenant by the
        database rather than by a predicate. The organization is resolved
        from the authenticated context — never a query parameter — the same
        discipline GET /admin/tenant-org applies. The DTO never includes the
        token or its hash; the token exists only in the response of
        POST /admin/invitations, once. Paging is keyset over
        invitation_id, which is a ULID and therefore ordered by creation.
      operationId: listInvitations
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last invitation_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of the caller's own organization's invitations
          content: { application/json: { schema: { $ref: '#/components/schemas/InvitationList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Invite an email address into the CALLER'S OWN organization
      description: >-
        Mints an invitation and returns its one-time plaintext token. The
        organization and tenant are resolved from the authenticated context
        ONLY, never the request body — there is no org_id or tenant_id field
        to smuggle one through, which is what stops a tenant administrator
        from inviting someone into another tenant's organization. The token
        is returned exactly once, in this response, alongside the invitation;
        it is unrecoverable afterward (domain.Invitation stores only its
        SHA-256 hash) and never appears in GET /admin/invitations or in any
        log line.
      operationId: createInvitation
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: The invitation, including the one-time plaintext token
          content: { application/json: { schema: { $ref: '#/components/schemas/CreateInvitationResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/invitations/{id}:
    delete:
      summary: Revoke an invitation
      description: >-
        Withdraws a pending invitation. The row is NOT deleted — revocation is
        a status change — and the revoked invitation is returned rather than
        an empty response, the same convention DELETE /admin/memberships/{id}
        uses. Safe to call twice: an already-revoked or already-redeemed
        invitation is a conflict, not a second revocation. Isolation is the
        tenant-scoped pool's row-level security: an id naming another
        tenant's invitation matches no row and reports 404, never a 403 that
        would confirm it exists elsewhere.
      operationId: revokeInvitation
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The revoked invitation
          content: { application/json: { schema: { $ref: '#/components/schemas/Invitation' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /auth/invitations/redeem:
    post:
      summary: Redeem an invitation token (UNAUTHENTICATED)
      description: >-
        Deliberately outside the /v1 contract and outside the router's
        contract-bijection sweep, exactly like /auth/config: this endpoint
        carries no bearer token by design, and s.authenticate on the /v1 group
        would reject a caller who has not obtained one yet — which is the
        entire situation this endpoint exists to resolve. Possession of the
        32-byte token in the request body IS the authorization (E-ID.4b; ADR
        pending — follows ADR-IAC-003, which reserved this story). In one
        transaction it consumes the invitation, creates
        or activates the account it names, and grants that account an active
        membership in the invitation's own organization — never anything a
        caller could name in the request. Every failure (unknown token,
        already redeemed, revoked, expired, or naming a suspended/deactivated
        account) is the identical generic response; distinguishing any of them
        would make this an oracle for guessing valid tokens or for confirming
        that an email address already has an account. Rate-limited like the
        rest of the service (ADR-SECURITY-004), keyed to a single shared
        bucket for this route since there is no authenticated tenant to key
        one on.
      operationId: redeemInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemInvitationRequest' }
      responses:
        '200':
          description: The invitation was redeemed; the invitee is now an active member
          content: { application/json: { schema: { $ref: '#/components/schemas/RedeemInvitationResponse' } } }
