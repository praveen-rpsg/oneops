          application/json:
            schema: { $ref: '#/components/schemas/PatchIncidentRequest' }
      responses:
        '200':
          description: The updated incident
          content: { application/json: { schema: { $ref: '#/components/schemas/Incident' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/incidents/{id}/transition:
    post:
      summary: Perform a lifecycle transition on an incident (E5.1)
      description: >-
        The single authority for status changes, checked against
        domain.IncidentStatus.CanTransitionTo: open -> acknowledged ->
        investigating -> resolved -> closed, plus resolved -> reopened ->
        investigating. An illegal move (e.g. open -> resolved, skipping the
        pipeline) returns 409. acknowledged_at/resolved_at/closed_at are set
        when the corresponding state is (re-)entered.
      operationId: transitionIncident
      security: [ { bearerAuth: [] } ]
