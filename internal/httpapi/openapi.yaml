          description: Replay job
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplayJob' } } }
        '404': { $ref: '#/components/responses/Problem' }

  # Policy automation (admin). Policies react to committed governance events; they
  # never participate in governance execution.
  /v1/admin/users:
    get:
      summary: List users, or resolve one by email address
      description: >-
        Users are global to the platform: a person exists before, and
        independently of, any membership (ADR-IDENTITY-001 §8.2), so this
        collection is not scoped to a tenant and administering it is a platform
        operation. Supplying `email` resolves a single address and returns a
        list of zero or one — the collection exists whether or not anything in
        it matched, so a filter that finds nothing is an empty page, not a 404.
        Paging is keyset over `user_id`, which is a ULID and therefore ordered
        by creation; `limit` is clamped so an unbounded request cannot hand the
        whole table to one caller.
      operationId: listUsers
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: email
          in: query
          description: Resolve a single user by address, case-insensitively.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
        - name: after
          in: query
          description: Keyset cursor — the last user_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of users
          content: { application/json: { schema: { $ref: '#/components/schemas/UserList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Register a user
      description: >-
        The user starts `invited` and holds no access until a membership grants
        it. The identifier is minted server-side and is not accepted from the
        caller. The address is unique platform-wide and compared
        case-insensitively, so a differently cased duplicate is a conflict
        rather than a second account for the same person.
      operationId: createUser
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } }
      responses:
        '201':
          description: Created user
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/users/{id}:
    get:
      summary: Get a user
      operationId: getUser
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The user
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Change a display name, or perform a lifecycle transition
      description: >-
        Exactly one of `display_name` or `status` per call. The two follow
        different paths — a status change is checked against the lifecycle, a
        rename is not — and a request doing both would consume two row versions
        and leave the outcome of one of them unreported.


        `row_version` is required and is the version last read for this user. A
        stale value is a 409: the record changed underneath the caller, who must
        re-read before deciding again.


        A refused transition is also a 409, not a 422: the target state is
        well-formed, it is the move that is not allowed. Deactivation is
        terminal — the row is retained so audit events keep an attributable
        author (ADR-IDENTITY-001 §8.3).
      operationId: patchUser
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchUserRequest' } } }
      responses:
        '200':
          description: Updated user
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/audit/events:
    get:
      summary: Query administrative audit history
      description: >-
        The constitutional read boundary for administrative audit
        (ADR-AUDIT-007 §6.5). Administrative acts — user, organization,
        membership, invitation and tenant mutations — are recorded on a store
        separate from the constitutional audit chain, are never delivered to
        webhook subscribers, and are readable only here and only by platform
        administrators. The store is deliberately outside row-level security
        (§6.4), so this middleware and the privileged database role behind it
        are the isolation.
        Ordering is newest first over (occurred_at, chain_id, seq). That tuple
        is a total order — occurred_at alone is not unique, because one
        administrative act can write sibling records on the same timestamp — so
        the keyset cursor can neither skip a row nor repeat one. `payload_canonical`
        is the exact byte sequence the chain hash was computed over, so a caller
        can verify a record rather than trust this rendering of it.
      operationId: listAdminAuditEvents
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: actor
          in: query
          description: Who performed the act.
          schema: { type: string }
        - name: operation
          in: query
          description: What was done, e.g. `user.created`.
          schema: { type: string }
        - name: subject_org_id
          in: query
          description: The organization acted upon.
          schema: { type: string }
        - name: subject_tenant_id
          in: query
          description: The tenant acted upon.
          schema: { type: string }
        - name: subject_user_id
          in: query
          description: The user acted upon.
          schema: { type: string }
        - name: from
          in: query
          description: Inclusive lower bound on occurred_at, RFC 3339.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Inclusive upper bound on occurred_at, RFC 3339.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Opaque keyset cursor returned as next_cursor by the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of administrative audit records
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminAuditList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/memberships:
    get:
      summary: List an organization's memberships
      description: >-
        Membership is tenant-owned and under row-level security, so the result
        is confined to the caller's tenant by the database rather than by a
        predicate. An org_id belonging to another tenant returns an empty page,
        not a refusal: the rows are invisible, and invisible is deliberately
        indistinguishable from absent. Paging is keyset over `membership_id`,
        which is a ULID and therefore ordered by creation.
      operationId: listMemberships
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: org_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last membership_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of memberships
          content: { application/json: { schema: { $ref: '#/components/schemas/MembershipList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Grant a membership
      description: >-
        Binds a user to an organization. The tenant is taken from the bound
        connection and never from the request, so a caller cannot plant a
        membership inside another boundary. Re-granting a revoked membership
        reactivates it rather than creating a second row; an already-active
        membership is returned unchanged. Every grant writes an administrative
        audit record in the same transaction (ADR-AUDIT-007 §6.9).
      operationId: grantMembership
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantMembershipRequest' }
      responses:
        '201':
          description: The membership
          content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/memberships/{id}:
    delete:
      summary: Revoke a membership
      description: >-
        Withdraws a membership. The row is NOT deleted — revocation is a state
        change, so the administrative record of the grant keeps a subject to
        point at (ADR-IDENTITY-001 §8.3) — and the revoked membership is
        returned rather than an empty response so the caller can see that. Safe
        to call twice: an already-revoked membership is a conflict, not a second
        revocation. Writes an administrative audit record in the same
        transaction.
      operationId: revokeMembership
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The revoked membership
          content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/teams:
    get:
      summary: List an organization's teams
      description: >-
        Team is tenant-owned and under row-level security, exactly like
        Membership, so the result is confined to the caller's tenant by the
        database. An org_id belonging to another tenant returns an empty page,
        not a refusal. Paging is keyset over `team_id`, which is a ULID and
        therefore ordered by creation.
      operationId: listTeams
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: org_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last team_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of teams
          content: { application/json: { schema: { $ref: '#/components/schemas/TeamList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Register a team within an organization
      description: >-
        The tenant is taken from the bound connection and never from the
        request, so a caller cannot plant a team inside another boundary
        (the same rule grantMembership enforces).
      operationId: createTeam
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamRequest' }
      responses:
        '201':
          description: The team
          content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/teams/{id}:
    get:
      summary: Get a team by identifier
      operationId: getTeam
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The team
          content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Rename a team or perform a lifecycle transition
      description: >-
        Supply exactly one of name or status per call — the same rule
        PatchUserRequest enforces, and for the same reason: the two go through
        different repository methods, so a request that changed both would
        consume two row versions and leave the outcome of one unreported.
      operationId: patchTeam
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchTeamRequest' }
      responses:
        '200':
          description: The updated team
          content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/teams/{id}/members:
    get:
      summary: List a team's members
      operationId: listTeamMembers
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last team_membership_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of team members
          content: { application/json: { schema: { $ref: '#/components/schemas/TeamMembershipList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Add a member to a team
      description: >-
        Idempotent: a user already on the team is returned unchanged rather
        than rejected as a conflict. Team membership is not an authorisation
        fact — Membership alone grants access to an organization's boundary —
        so this does not affect what the user may do, only who a team groups.
      operationId: addTeamMember
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddTeamMemberRequest' }
      responses:
        '201':
          description: The team membership
          content: { application/json: { schema: { $ref: '#/components/schemas/TeamMembership' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/teams/{id}/members/{userId}:
    delete:
      summary: Remove a member from a team
      description: >-
        A real delete, unlike Membership.Revoke: team membership carries no
        status because it authorises nothing on its own, so there is no
        administrative record whose subject the row must survive for.
      operationId: removeTeamMember
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: The member was removed
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/assets:
    get:
      summary: List the caller's tenant's CMDB assets (Configuration Items)
      description: >-
        asset is tenant-owned and under row-level security, exactly like
        Team, so the result is confined to the caller's tenant by the
        database. Paging is keyset over `asset_id`, a ULID and therefore
        ordered by creation.
      operationId: listAssets
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last asset_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of assets
          content: { application/json: { schema: { $ref: '#/components/schemas/AssetList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Register a Configuration Item
      description: >-
        The tenant is taken from the bound connection and never from the
        request, so a caller cannot plant an asset inside another boundary
        (the same rule createTeam enforces). `type` is an open but validated
        set (lower-case snake_case) — server, service, network_device,
        application, database and future increments' types are all accepted.
      operationId: createAsset
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssetRequest' }
      responses:
        '201':
          description: The asset
          content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/relationships:
    post:
      summary: Create a CMDB relationship between two assets
      description: >-
        Both from_asset_id and to_asset_id must already name assets visible
        to the caller's tenant — confirmed on the tenant-scoped connection
        before the edge is created, because PostgreSQL's foreign-key checks
        bypass row-level security on the referenced table (ADR-ASSET-001
        §6). A from/to id the tenant cannot see returns 404, identical to one
        that does not exist.
      operationId: createAssetRelationship
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssetRelationshipRequest' }
      responses:
        '201':
          description: The relationship
          content: { application/json: { schema: { $ref: '#/components/schemas/AssetRelationship' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/relationships/{id}:
    delete:
      summary: Remove a CMDB relationship
      operationId: deleteAssetRelationship
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: The relationship was removed
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/{id}:
    get:
      summary: Get an asset by identifier
      operationId: getAsset
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The asset
          content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Change an asset's name, attributes and/or status
      description: >-
        Supply at least one of name, attributes or status. Unlike
        PatchTeamRequest, these may be combined in one call — Asset has no
        authorisation-adjacent status split to protect.
      operationId: patchAsset
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchAssetRequest' }
      responses:
        '200':
          description: The updated asset
          content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete an asset
      description: >-
        A real delete, unlike Team's archive-only lifecycle: an Asset is not
        a named governed grouping. Its relationships are removed with it
        (ON DELETE CASCADE).
      operationId: deleteAsset
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: The asset was deleted
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/{id}/relationships:
    get:
      summary: List the direct (one-hop) relationships naming an asset
      operationId: listAssetRelationships
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The asset's direct in- and out-edges
          content: { application/json: { schema: { $ref: '#/components/schemas/AssetRelationshipEdges' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/{id}/dependencies:
    get:
      summary: Dependencies of an asset in the CMDB graph (forward)
      description: >
        Direct dependencies by default; the transitive forward closure when
        recursive=true. Reuses the same dependency-graph engine
        /v1/configurations/{cfgId}/dependencies uses, over asset_relationship
        instead of dependency_edge (ADR-ASSET-001 §4).
      operationId: getAssetDependencies
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: recursive, in: query, schema: { type: boolean, default: false } }
        - { name: max_depth, in: query, schema: { type: integer, minimum: 1 }, description: Cap recursive depth. }
      responses:
        '200':
          description: Reachable dependency nodes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetTraversalResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/assets/{id}/dependents:
    get:
      summary: Dependents of an asset in the CMDB graph (reverse)
      description: >
        Direct dependents by default; the transitive reverse closure when
        recursive=true.
      operationId: getAssetDependents
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: recursive, in: query, schema: { type: boolean, default: false } }
        - { name: max_depth, in: query, schema: { type: integer, minimum: 1 }, description: Cap recursive depth. }
      responses:
        '200':
          description: Reachable dependent nodes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetTraversalResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/notifications:
    get:
      summary: List the caller's tenant's notifications
      description: >-
        Notification is tenant-owned and under row-level security, exactly
        like Team, so the result is confined to the caller's tenant by the
        database. There is no create route here: a Notification is produced
        only by a policy's "notification" action (or a future producer),
        never directly over HTTP. Paging is keyset over `notification_id`,
        which is a ULID and therefore ordered by creation.
      operationId: listNotifications
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, sent, failed] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: after
          in: query
          description: Keyset cursor — the last notification_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of notifications
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/notifications/{id}:
    get:
      summary: Get a notification by identifier
      operationId: getNotification
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The notification
          content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/settings:
    get:
      summary: Get the caller's tenant's effective settings
      description: >-
        Setting is tenant-owned and under row-level security, exactly like
        Team, so the result reflects only the caller's tenant. Every key
        defined in the platform's SettingDefinition registry is returned once,
        resolved to its stored override if the tenant has one, otherwise to
        its default — there is no way to see a key that is not in the
        registry, and no way for the registry to omit one silently.
      operationId: listSettings
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: The tenant's effective settings
          content: { application/json: { schema: { $ref: '#/components/schemas/SettingList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/settings/{key}:
    put:
      summary: Create or update the caller's tenant's override of one setting
      description: >-
        `key` must name an entry in the platform's SettingDefinition registry;
        an unknown key or a value that fails that definition's validation
        (wrong type, out of range, not an allowed enum value) is refused with
        422 before anything is written. `row_version` is 0 to create a new
        override, or the version last read from GET /admin/settings to update
        one — the same optimistic-locking discipline PatchTeamRequest uses.
      operationId: putSetting
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutSettingRequest' }
      responses:
        '200':
          description: The updated effective setting
          content: { application/json: { schema: { $ref: '#/components/schemas/Setting' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/organizations:
    get:
      summary: List organizations, or resolve one by slug
      description: >-
        An Organization is a scope of Identity to which Policy attaches, realised
        as an isolation boundary by exactly one Tenant (ADR-IDENTITY-001 §4).
        The registry is global rather than tenant-scoped: `tenant_id` is
        discovered BY reading this mapping, so scoping the mapping on it would be
        circular (ADR-IDENTITY-002 §3.1). Supplying `slug` resolves a single
        organization and returns a list of zero or one — the collection exists
        whether or not anything in it matched, so a filter that finds nothing is
        an empty page, not a 404. Paging is keyset over `org_id`, which is a ULID
        and therefore ordered by creation.
      operationId: listOrganizations
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: slug
          in: query
          description: Resolve a single organization by its addressable name.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
        - name: after
          in: query
          description: Keyset cursor — the last org_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of organizations
          content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Register an organization and the tenant realising it
      description: >-
        Creates the Identity scope AND its isolation boundary in one
        transaction: both rows or neither (ADR-IDENTITY-001 §7.1). An
        organization whose tenant was not created would be an Identity scope
        with no isolation, and a tenant with no organization would be a boundary
        nothing points at.


        Neither identifier is accepted from the caller. Both are minted
        server-side, so a caller cannot choose a tenant_id colliding with the
        system tenant. The slug is unique across organizations and tenants
        alike, so a slug already held by either is a conflict.
      operationId: createOrganization
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrganizationRequest' } } }
      responses:
        '201':
          description: Created organization
          content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/organizations/{id}:
    get:
      summary: Get an organization
      operationId: getOrganization
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The organization
          content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Suspend or reactivate an organization
      description: >-
        Suspension is the only mutation the registry exposes, and it cascades to
        the realising tenant in the same transaction (ADR-IDENTITY-001 §8.3).
        The cascade is the point: the authentication boundary reads tenant
        status, so suspending the organization alone would leave its tenant
        serving requests for a scope nobody may enter.


        An organization is never deleted. Governed objects are anchored to its
        tenant by an append-only audit chain, so removing it would orphan
        records that cannot themselves be removed.


        `row_version` is required and is the version last read for this
        organization. A stale value is a 409: the record changed underneath the
        caller, who must re-read before deciding again.
      operationId: patchOrganization
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchOrganizationRequest' } } }
      responses:
        '200':
          description: Updated organization
          content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/tenants:
    get:
      summary: List tenants
      description: >-
        Returns every registered tenant. Administering tenants is strictly more
        privileged than administering data inside one, so this requires admin.
      operationId: listTenants
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Tenants
          content: { application/json: { schema: { $ref: '#/components/schemas/TenantList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Register a tenant
      description: >-
        Creates an isolation boundary. The tenant_id is minted server-side so a
        caller cannot choose an identifier that collides with the system tenant.
      operationId: createTenant
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTenantRequest' } } }
      responses:
        '201':
          description: Created tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/tenants/{id}:
    patch:
      summary: Suspend or reactivate a tenant
      description: >-
        Suspension is the only mutation the registry exposes. A tenant is never
        deleted: its audit history is append-only by constitutional guarantee,
        so removing the tenant would orphan records that cannot be removed. The
        system tenant cannot be suspended — doing so would lock the platform out
        of every row written before tenancy existed.
      operationId: patchTenant
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchTenantRequest' } } }
      responses:
        '200':
          description: Updated tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/policies:
    get:
      summary: List policies
      operationId: listPolicies
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Policies
          content: { application/json: { schema: { $ref: '#/components/schemas/PolicyList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create a policy
      operationId: createPolicy
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePolicyRequest' } } }
      responses:
        '201':
          description: Created policy
          content: { application/json: { schema: { $ref: '#/components/schemas/Policy' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/policies/{id}:
    patch:
      summary: Update a policy (enable/disable, condition, action)
      operationId: patchPolicy
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchPolicyRequest' } } }
      responses:
        '200':
          description: Updated policy
          content: { application/json: { schema: { $ref: '#/components/schemas/Policy' } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a policy
      operationId: deletePolicy
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/policies/{id}/executions:
    get:
      summary: List a policy's executions
      operationId: listPolicyExecutions
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
