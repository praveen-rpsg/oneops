  /v1/admin/policies/{id}/runs/{runId}:
    get:
      summary: Inspect a composed run's progress (ADR-POLICY-001)
      operationId: getPolicyRun
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Run progress
          content: { application/json: { schema: { $ref: '#/components/schemas/PolicyRun' } } }
        '404': { $ref: '#/components/responses/Problem' }

