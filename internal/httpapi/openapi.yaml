      responses:
        '201':
          description: Created policy
          content: { application/json: { schema: { $ref: '#/components/schemas/Policy' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/policies/{id}:
    patch:
      summary: Update a policy (enable/disable, condition, action)
      operationId: patchPolicy
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchPolicyRequest' } } }
      responses:
        '200':
          description: Updated policy
          content: { application/json: { schema: { $ref: '#/components/schemas/Policy' } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a policy
      operationId: deletePolicy
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/policies/{id}/executions:
    get:
      summary: List a policy's executions
      operationId: listPolicyExecutions
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Executions
          content: { application/json: { schema: { $ref: '#/components/schemas/PolicyExecutionList' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/policies/{id}/test:
    post:
      summary: Run one synthetic execution of a policy's action
      operationId: testPolicy
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Test result
          content: { application/json: { schema: { $ref: '#/components/schemas/PolicyTestResult' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/policies/{id}/runs/{runId}:
    get:
      summary: Inspect a composed run's progress (ADR-POLICY-001)
      operationId: getPolicyRun
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Run progress
          content: { application/json: { schema: { $ref: '#/components/schemas/PolicyRun' } } }
        '404': { $ref: '#/components/responses/Problem' }

  # Execution timeline (admin) — a read-only operational read model composed from
  # existing persisted data. It participates in no execution.
  /v1/admin/timeline/{eventID}:
    get:
      summary: Execution timeline correlated by audit event id
      operationId: getEventTimeline
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: eventID, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/TimelineFrom' }
        - { $ref: '#/components/parameters/TimelineTo' }
        - { $ref: '#/components/parameters/TimelineComponent' }
        - { $ref: '#/components/parameters/TimelineStatus' }
        - { $ref: '#/components/parameters/TimelineOffset' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Timeline
          content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/governance/{id}/timeline:
    get:
      summary: Execution timeline for a configuration object (governance id)
      operationId: getGovernanceTimeline
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/TimelineComponent' }
        - { $ref: '#/components/parameters/TimelineStatus' }
        - { $ref: '#/components/parameters/TimelineOffset' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Timeline
          content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/replay/{jobID}/timeline:
    get:
      summary: Execution timeline for a replay job
      operationId: getReplayTimeline
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Timeline
          content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/policies/{id}/timeline:
    get:
      summary: Execution timeline for a policy execution
      operationId: getPolicyTimeline
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Timeline
          content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } }
        '404': { $ref: '#/components/responses/Problem' }

  # Compliance & evidence (admin) — read-only. Deterministic evidence composed
  # from existing persisted data; participates in no execution.
  /v1/admin/compliance/reports:
    get:
      summary: List compliance summaries across governance objects
      operationId: getComplianceReports
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Compliance report page
          content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceReportPage' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/compliance/{governanceID}:
    get:
      summary: Compliance status summary for a governance object
      operationId: getComplianceSummary
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: governanceID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Compliance summary
          content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceSummary' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/compliance/{governanceID}/evidence:
    get:
      summary: Immutable evidence bundle (JSON, or ZIP with format=zip)
      operationId: getComplianceEvidence
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: governanceID, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, zip] } }
      responses:
        '200':
          description: Evidence bundle
          content:
            application/json: { schema: { $ref: '#/components/schemas/Evidence' } }
            application/zip: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/admin/compliance/{governanceID}/checks:
    get:
      summary: Compliance check results for a governance object
      operationId: getComplianceChecks
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: governanceID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Compliance checks
          content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceCheckList' } } }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GovId:
      name: id
      in: path
      required: true
      description: Configuration object id (cfg_id).
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Idempotency key; used as the OperationID and drives the deterministic audit event id.
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected row_version (ETag) for optimistic concurrency; omit to skip the check.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum items to return (bounded by the server maximum).
      schema: { type: integer, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor (last seq of the previous page).
      schema: { type: string }
    Order:
      name: order
      in: query
      required: false
      description: Sort order by sequence.
      schema: { type: string, enum: [asc, desc], default: asc }
    OperationFilter:
      name: operation
      in: query
      required: false
      description: Filter to a single §8 operation.
      schema: { type: string }
    TimelineFrom:
      name: from
      in: query
      required: false
      description: Include entries at or after this RFC3339 time.
      schema: { type: string, format: date-time }
    TimelineTo:
      name: to
      in: query
      required: false
      description: Include entries at or before this RFC3339 time.
      schema: { type: string, format: date-time }
    TimelineComponent:
      name: component
      in: query
      required: false
      schema: { type: string, enum: [governance, audit, webhook, replay, policy] }
    TimelineStatus:
      name: status
      in: query
      required: false
      schema: { type: string }
    TimelineOffset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
  responses:
    Problem:
      description: RFC 7807 problem detail
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GovernanceResult:
      description: The operation was applied atomically with its audit event.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GovernanceResponse' }
  schemas:
    Membership:
      type: object
      properties:
        membership_id: { type: string }
        org_id: { type: string }
        user_id: { type: string }
        status: { type: string, enum: [active, revoked] }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MembershipList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
    GrantMembershipRequest:
      type: object
      required: [org_id, user_id]
      properties:
        org_id: { type: string }
        user_id: { type: string }
    Invitation:
      type: object
      description: >-
        Deliberately has no token or token_hash field. The plaintext token is
        returned exactly once, only in CreateInvitationResponse; it is
        unrecoverable from this representation and from the table alike.
      properties:
        invitation_id: { type: string }
        org_id: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [pending, redeemed, revoked, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        redeemed_at: { type: string, format: date-time, nullable: true }
    InvitationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
    CreateInvitationRequest:
      type: object
      required: [email]
      description: >-
        Carries no org_id or tenant_id: the target organization is resolved
        from the caller's authenticated context only.
      properties:
        email: { type: string, format: email, maxLength: 254 }
    CreateInvitationResponse:
      description: >-
        The invitation plus the one-time plaintext token. This is the only
        response in the contract that carries a token field.
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          properties:
            token: { type: string }
    RedeemInvitationRequest:
      type: object
      required: [token]
      description: >-
        Carries ONLY the token. Every other fact the redemption needs —
        organization, tenant, email — is resolved from the invitation row the
        token names, never from this request.
      properties:
        token: { type: string }
    RedeemInvitationResponse:
      type: object
      description: >-
        Deliberately minimal: no user id, membership id or invitation id,
        each of which would be one more identifier available to whoever
        holds, or is guessing, a token.
      properties:
        organization: { type: string, description: The organization the invitee just joined. }
    Team:
      type: object
      properties:
        team_id: { type: string }
        org_id: { type: string }
        name: { type: string, maxLength: 200 }
        status: { type: string, enum: [active, archived] }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Team' }
    CreateTeamRequest:
      type: object
      required: [org_id, name]
      properties:
        org_id: { type: string }
        name: { type: string, maxLength: 200 }
    PatchTeamRequest:
      type: object
      required: [row_version]
      description: Supply exactly one of name or status.
      properties:
        row_version: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 200 }
        status:
          type: string
          enum: [active, archived]
    TeamMembership:
      type: object
      properties:
        team_membership_id: { type: string }
        team_id: { type: string }
        user_id: { type: string }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamMembershipList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamMembership' }
    AddTeamMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
    Asset:
      type: object
      description: >-
        A Configuration Item — the operational unit every downstream
        NOC/SOC/ITSM capability references. Distinct from a Configuration
        Object (ADR-ASSET-001 §2).
      properties:
        asset_id: { type: string }
        type:
          type: string
          description: >-
            Open but validated: lower-case snake_case, e.g. server, service,
            network_device, application, database.
        name: { type: string, maxLength: 200 }
        attributes:
          type: object
          additionalProperties: true
        status: { type: string, enum: [planned, active, maintenance, retired] }
        environment:
          type: string
          enum: [production, staging, development, unknown]
          description: Deployment environment. Feeds NOC health rollups (E1.2).
        criticality:
          type: string
          enum: [critical, high, medium, low, unknown]
          description: Business-impact tier. Feeds SOC vulnerability prioritization and ITSM routing (E1.2).
        owner_team_id:
          type: string
          nullable: true
          description: The team accountable for this asset, or absent when unowned.
        owner_user_id:
          type: string
          nullable: true
          description: The individual accountable for this asset, or absent when unowned.
        source:
          type: string
          description: >-
            The system that produced this CI: manual (the default),
            discovery, aws, snmp, ... Open but validated, mirrors `type`
            (E1.4).
        external_ref:
          type: string
          nullable: true
          description: >-
            The natural key `source` uses for this CI, or absent for a
            manually-entered asset with no external identity. Unique per
            (tenant, source) when present — the key POST .../import matches
            on (E1.4).
        last_seen:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this CI was last confirmed by a source (E1.5): set by
            create, update and import/upsert (including a no-op re-import —
            see POST .../import). Absent/null means never confirmed since
            this field existed — GET .../health treats that the same as a
            very old timestamp. Read-only: no request in this API accepts it.
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
    CreateAssetRequest:
      type: object
      required: [type, name]
      description: >-
        environment/criticality default to "unknown" when omitted (the same
        default the column carries). owner_team_id/owner_user_id are
        optional; when set, the id is re-verified against the caller's
        tenant before the asset is written (ADR-ASSET-001 §6, extended to
        ownership) — an id the tenant cannot see returns 404. status is
        optional and defaults to "active"; the only other accepted value at
        creation is "planned" — maintenance and retired describe something
        that happened to a CI already in service and are reached only by a
        later PATCH .../status transition (E1.3).
      properties:
        type: { type: string }
        name: { type: string, maxLength: 200 }
        attributes:
          type: object
          additionalProperties: true
        status: { type: string, enum: [planned, active] }
        environment:
          type: string
          enum: [production, staging, development, unknown]
        criticality:
          type: string
          enum: [critical, high, medium, low, unknown]
        owner_team_id: { type: string }
        owner_user_id: { type: string }
        source:
          type: string
          description: Defaults to "manual" when omitted or blank (E1.4).
        external_ref:
          type: string
          description: >-
            The natural key an external source uses for this CI. Setting it
            here does not make the call idempotent — a second createAsset
            call always creates a second row; use POST .../import to
            upsert by (tenant, source, external_ref).
    PatchAssetRequest:
      type: object
      required: [row_version]
      description: >-
        Supply either status alone (a lifecycle transition, checked against
        the CMDB state machine — E1.3) or one or more of name, attributes,
        environment, criticality, owner_team_id, owner_user_id — never both
        in the same call; combining them is refused with 422 for the same
        reason PatchUserRequest refuses combining display_name and status.
        owner_team_id/owner_user_id are tri-state: absent leaves ownership
        unchanged, "" clears it, and a non-empty id sets it (re-verified
        against the caller's tenant first).
      properties:
        row_version: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 200 }
        attributes:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [planned, active, maintenance, retired]
          description: >-
            A lifecycle transition target, checked against
            AssetStatus.CanTransitionTo; an illegal move (e.g. planned ->
            maintenance) returns 409. Mutually exclusive with every other
            field in this request.
        environment:
          type: string
          enum: [production, staging, development, unknown]
        criticality:
          type: string
          enum: [critical, high, medium, low, unknown]
        owner_team_id: { type: string }
        owner_user_id: { type: string }
    AssetRelationship:
      type: object
      description: A directed, typed edge of the CMDB graph between two Assets.
      properties:
        relationship_id: { type: string }
        from_asset_id: { type: string }
        to_asset_id: { type: string }
        type: { type: string, enum: [depends_on, runs_on, connected_to, member_of] }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetRelationshipEdges:
      type: object
      description: An asset's direct (one-hop) in- and out-edges.
      properties:
        from:
          type: array
          items: { $ref: '#/components/schemas/AssetRelationship' }
        to:
          type: array
          items: { $ref: '#/components/schemas/AssetRelationship' }
    CreateAssetRelationshipRequest:
      type: object
      required: [from_asset_id, to_asset_id, type]
      properties:
        from_asset_id: { type: string }
        to_asset_id: { type: string }
        type: { type: string, enum: [depends_on, runs_on, connected_to, member_of] }
    AssetTraversalResponse:
      type: object
      description: >-
        Same shape as TraversalResponse, over the CMDB graph. Node ids are
        asset_ids rather than cfg_ids (ADR-ASSET-001 §4).
      properties:
        root: { type: string }
        direction: { type: string, enum: [dependencies, dependents] }
        recursive: { type: boolean }
        count: { type: integer }
        nodes:
          type: array
          items:
            type: object
            properties:
              asset_id: { type: string }
              depth: { type: integer }
    ServiceMapResponse:
      type: object
      description: >-
        The supporting Configuration Items composing a business_service — a
        projection over the CMDB graph restricted to depends_on/runs_on
        edges (E1.2).
      properties:
        service_id: { type: string }
        count: { type: integer }
        supporting_cis:
          type: array
          items:
            type: object
            properties:
              asset_id: { type: string }
              depth: { type: integer }
    AssetChangeEntry:
      type: object
      description: >-
        One append-only row of an asset's change history (E1.3). field/
        old_value/new_value are absent for the single "created" row written
        at insert time — there is no prior state to diff against.
      properties:
        change_id: { type: string }
        asset_id: { type: string }
        kind: { type: string, enum: [created, updated, status_transitioned] }
        field: { type: string }
        old_value: { type: string, nullable: true }
        new_value: { type: string, nullable: true }
        actor: { type: string }
        row_version: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
    AssetChangeHistoryList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssetChangeEntry' }
    ImportAssetRow:
      type: object
      required: [type, name]
      description: >-
        Same shape as CreateAssetRequest, matched by (tenant, source,
        external_ref) on import (E1.4). ExternalRef absent always creates;
        present and matching an existing row replaces every field this row
        carries. status is optional and defaults to "active"; only planned
        is otherwise accepted — maintenance/retired are reached only by a
        later PATCH .../status transition, never by import.
      properties:
        type: { type: string }
        name: { type: string, maxLength: 200 }
        attributes:
          type: object
          additionalProperties: true
        status: { type: string, enum: [planned, active] }
        environment:
          type: string
          enum: [production, staging, development, unknown]
        criticality:
          type: string
          enum: [critical, high, medium, low, unknown]
        owner_team_id: { type: string }
        owner_user_id: { type: string }
        source:
          type: string
          description: Defaults to "manual" when omitted or blank.
        external_ref:
          type: string
          description: The natural key this row's source uses for the CI.
    ImportAssetsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ImportAssetRow' }
    AssetImportResult:
      type: object
      description: >-
        One input row's outcome, at that row's input index — always present
        even when the row failed, so a caller can correlate a failure back
        to the request it sent.
      properties:
        index: { type: integer }
        outcome: { type: string, enum: [created, updated, failed] }
        asset_id: { type: string, description: Present when outcome is created or updated. }
        reason: { type: string, description: Present when outcome is failed. }
    ImportAssetsResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/AssetImportResult' }
    AssetDuplicateMember:
      type: object
      description: One Configuration Item inside a duplicate group (E1.4).
      properties:
        asset_id: { type: string }
        type: { type: string }
        name: { type: string }
        source: { type: string }
        external_ref: { type: string, nullable: true }
        status: { type: string, enum: [planned, active, maintenance, retired] }
    AssetDuplicateGroup:
      type: object
      description: >-
        A set of Configuration Items likely representing the same
        real-world CI (E1.4). key is the shared external_ref for
        same_external_ref_different_source, or "type:normalized_name" for
        same_type_and_name.
      properties:
        reason:
          type: string
          enum: [same_external_ref_different_source, same_type_and_name]
        key: { type: string }
        members:
          type: array
          items: { $ref: '#/components/schemas/AssetDuplicateMember' }
    AssetDuplicateGroupList:
      type: object
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/AssetDuplicateGroup' }
    AssetHealthSample:
      type: object
      description: >-
        One Configuration Item inside a bounded health-report category
        sample (E1.5) — enough to act on without a second round-trip through
        GET /admin/assets/{id}.
      properties:
        asset_id: { type: string }
        type: { type: string }
        name: { type: string }
    AssetHealthCategory:
      type: object
      description: >-
        count is the TRUE, uncapped number of matching Configuration Items;
        samples is bounded, so this report can never become an unbounded
        dump of the whole CMDB.
      properties:
        count: { type: integer }
        samples:
          type: array
          items: { $ref: '#/components/schemas/AssetHealthSample' }
    AssetHealthReport:
      type: object
      description: >-
        The CMDB data-quality/freshness report (E1.5). Answers "where is the
        record rotting", never "does the record match reality" — that needs
        E2's discovered state and is out of scope. A retired CI is excluded
        from every category.
      properties:
        stale_after:
          type: string
          description: The threshold this report was computed against (a Go duration string).
        stale: { $ref: '#/components/schemas/AssetHealthCategory' }
        orphaned_assets: { $ref: '#/components/schemas/AssetHealthCategory' }
        orphaned_business_services: { $ref: '#/components/schemas/AssetHealthCategory' }
        incomplete: { $ref: '#/components/schemas/AssetHealthCategory' }
    AssetGraphNode:
      type: object
      description: >-
        One node of the whole-tenant CMDB asset-graph projection (E7.3b-1) —
        deliberately narrower than Asset: attributes, ownership, source and
        timestamps are not topology-rendering fields.
      properties:
        asset_id: { type: string }
        name: { type: string }
        type: { type: string }
        status: { type: string, enum: [planned, active, maintenance, retired] }
        environment: { type: string, enum: [production, staging, development, unknown] }
        criticality: { type: string, enum: [critical, high, medium, low, unknown] }
    AssetGraphEdge:
      type: object
      description: One edge of the whole-tenant CMDB asset-graph projection.
      properties:
        from_asset_id: { type: string }
        to_asset_id: { type: string }
        type: { type: string, enum: [depends_on, runs_on, connected_to, member_of] }
    AssetGraph:
      type: object
      description: >-
        The whole tenant's CMDB asset graph (E7.3b-1, ADR-NOC-006), bounded
        to at most 2000 nodes and 5000 edges. truncated is true when either
        cap was reached.
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/AssetGraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/AssetGraphEdge' }
        truncated: { type: boolean }
    IngestSample:
      type: object
      required: [asset_id, metric, value, timestamp]
      description: >-
        One metric observation. asset_id must already name a Configuration
        Item visible to the caller's tenant.
      properties:
        asset_id: { type: string }
        metric:
          type: string
          description: Lower-case snake_case, e.g. cpu_utilization, disk_free_bytes.
          maxLength: 100
        value: { type: number, format: double }
        timestamp: { type: string, format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
          description: At most 20 labels; each key at most 100 characters, each value at most 200.
    IngestTelemetryRequest:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/IngestSample' }
    SampleWriteResult:
      type: object
      description: >-
        One input sample's outcome, at that sample's input index — always
        present even when the sample was rejected, so a caller can correlate
        a failure back to the request it sent.
      properties:
        index: { type: integer }
        outcome: { type: string, enum: [accepted, rejected] }
        reason: { type: string, description: Present when outcome is rejected. }
    IngestTelemetryResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SampleWriteResult' }
    Sample:
      type: object
      description: >-
        min/max/count are present only when this row came from the 5-minute
        rollup (resolution=rollup_5m, or resolution=auto over a wide window,
        E2.1b): value is then the bucket's average, timestamp is the bucket's
        start, and min/max/count describe the raw samples it summarises.
      properties:
        asset_id: { type: string }
        metric: { type: string }
        value: { type: number, format: double }
        timestamp: { type: string, format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
        min: { type: number, format: double }
        max: { type: number, format: double }
        count: { type: integer, format: int64 }
    SampleList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Sample' }
    IngestSecurityObservation:
      type: object
      required: [asset_id, observation_type, source, severity, observed_at]
      properties:
        asset_id: { type: string }
        observation_type:
          type: string
          description: Lower-case snake_case, e.g. port_scan, malware_detected, failed_login.
          maxLength: 100
        source:
          type: string
          description: Names the producer that reported this observation, e.g. wazuh, cloudtrail.
          maxLength: 200
        severity: { type: string, enum: [info, low, medium, high, critical] }
        observed_at: { type: string, format: date-time }
        attributes:
          type: object
          additionalProperties: { type: string }
          description: At most 20 attributes; each key at most 100 characters, each value at most 200.
    IngestSecurityObservationsRequest:
      type: object
      required: [observations]
      properties:
        observations:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/IngestSecurityObservation' }
    SecurityObservationWriteResult:
      type: object
      description: >-
        One input observation's outcome, at that observation's input index —
        always present even when the observation was rejected, so a caller
        can correlate a failure back to the request it sent.
      properties:
        index: { type: integer }
        outcome: { type: string, enum: [accepted, rejected] }
        reason: { type: string, description: Present when outcome is rejected. }
    IngestSecurityObservationsResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SecurityObservationWriteResult' }
    SecurityObservation:
      type: object
      description: >-
        An append-only fact tied to a Configuration Item (E8.1a) — the same
        category as Sample, deliberately not a reified SecurityEvent/Alert/Finding.
      properties:
        asset_id: { type: string }
        observation_type: { type: string }
        source: { type: string }
        severity: { type: string, enum: [info, low, medium, high, critical] }
        observed_at: { type: string, format: date-time }
        attributes:
          type: object
          additionalProperties: { type: string }
    SecurityObservationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SecurityObservation' }
    CollectorCheck:
      type: object
      description: >-
        A polled check target (E2.2a): the agentless collector framework's
        config. Its result is written as telemetry samples named
        <metric_prefix>_up, <metric_prefix>_latency_ms and
        <metric_prefix>_status_code — never a reified Alert/Metric.
      properties:
        check_id: { type: string }
        asset_id: { type: string }
        type:
          type: string
          description: >-
            Open but validated: lower-case snake_case. "http" is the only
            type with an executor today (E2.2a); SNMP (E2.2b) and cloud/API
            pollers (E2.2c) add more values later.
        target:
          type: string
          description: Interpreted according to `type` — a URL for "http".
        interval_seconds: { type: integer, minimum: 30, maximum: 2592000 }
        enabled: { type: boolean }
        metric_prefix:
          type: string
          maxLength: 80
          description: Lower-case snake_case, e.g. checkout_api.
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: Set only by the scheduler. Absent means never run.
        last_status:
          type: string
          enum: [ok, down, unsupported]
          description: Set only by the scheduler. Absent means never run.
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CollectorCheckList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CollectorCheck' }
    CreateCollectorCheckRequest:
      type: object
      required: [asset_id, target, interval_seconds, metric_prefix]
      description: >-
        `type` defaults to "http" when omitted. `enabled` defaults to true.
        When the resulting type is "http", `target` is validated as an
        http(s) URL with a host at creation time; the authoritative SSRF
        egress guard (non-public addresses) is enforced at dial time by
        every poll (ADR-SECURITY-001).
      properties:
        asset_id: { type: string }
        type: { type: string }
        target: { type: string, maxLength: 500 }
        interval_seconds: { type: integer, minimum: 30, maximum: 2592000 }
        metric_prefix: { type: string, maxLength: 80 }
        enabled: { type: boolean }
    PatchCollectorCheckRequest:
      type: object
      required: [row_version]
      description: >-
        Supply one or more of type, target, interval_seconds, enabled or
        metric_prefix. asset_id cannot be changed — delete and recreate the
        check instead.
      properties:
        row_version: { type: integer, format: int64 }
        type: { type: string }
        target: { type: string, maxLength: 500 }
        interval_seconds: { type: integer, minimum: 30, maximum: 2592000 }
        enabled: { type: boolean }
        metric_prefix: { type: string, maxLength: 80 }
    AlertRule:
      type: object
      description: >-
        A threshold config over one asset's one metric (E3.1). A firing is
        DERIVED by the leader-gated evaluator against telemetry_sample and
        delivered as a Notification — never a reified Alert/Event/Signal row.
        last_state/last_transition_at are the evaluator's last verdict, set
        only by it, never through PATCH. flap_dwell_seconds (E3.2) is how long
        a candidate transition must be observed continuously before the
        evaluator commits it (de-flap/hysteresis dwell), suppressing a
        metric oscillating around the threshold; it does not change what
        severity is attached, only when a transition is committed.
        symptom_class (E3.4) classifies WHAT this rule detects; explicit and
        operator-set, never inferred from metric, defaulting to
        "unspecified". Primitive only — nothing reads it to make a decision
        yet.
      properties:
        rule_id: { type: string }
        asset_id: { type: string }
        metric: { type: string }
        comparator: { type: string, enum: [gt, lt, gte, lte] }
        threshold: { type: number, format: double }
        for_duration_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: How long the breach must be sustained before the rule fires.
        severity: { type: string, enum: [critical, warning, info] }
        symptom_class:
          type: string
          enum: [availability, resource, unspecified]
          default: unspecified
          description: >-
            WHAT this rule detects (E3.4): availability = reachability/up-ness
            (cascades through dependencies); resource = a resource/utilization
            metric (cpu/disk/mem/latency — usually independent);
            unspecified = not classified (the default). Explicit,
            operator-set; never inferred from metric.
        enabled: { type: boolean }
        last_state:
          type: string
          enum: [ok, firing]
          description: Set only by the evaluator. A new rule starts at "ok".
        last_transition_at:
          type: string
          format: date-time
          nullable: true
          description: Set only by the evaluator. Absent means never evaluated to a transition.
        flap_dwell_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 60
          description: >-
            How long a candidate transition must be observed continuously
            before it is committed and notified (E3.2). 0 disables the dwell
            for this rule, reproducing immediate-transition behaviour.
        current_incident_id:
          type: string
          nullable: true
          description: >-
            The open, alert-sourced Incident this rule's firing is currently
            linked to (E4.1). Absent/null means the rule is ok, or is firing
            but not yet correlated to an incident. Set only by the evaluator,
            never through PATCH; cleared on the matching firing->ok
            transition (the linked incident itself is not auto-resolved).
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertRuleList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AlertRule' }
    CreateAlertRuleRequest:
      type: object
      required: [asset_id, metric, comparator, threshold, for_duration_seconds]
      description: >-
        severity defaults to "warning" when omitted. symptom_class defaults
        to "unspecified" when omitted (E3.4). enabled defaults to
        true. flap_dwell_seconds defaults to 60 when omitted (E3.2).
      properties:
        asset_id: { type: string }
        metric: { type: string }
        comparator: { type: string, enum: [gt, lt, gte, lte] }
        threshold: { type: number, format: double }
        for_duration_seconds: { type: integer, minimum: 1, maximum: 86400 }
        severity: { type: string, enum: [critical, warning, info] }
        symptom_class:
          type: string
          enum: [availability, resource, unspecified]
          default: unspecified
        enabled: { type: boolean }
        flap_dwell_seconds: { type: integer, minimum: 0, maximum: 86400, default: 60 }
    PatchAlertRuleRequest:
      type: object
      required: [row_version]
      description: >-
        Supply one or more of comparator, threshold, for_duration_seconds,
        severity, symptom_class, enabled or flap_dwell_seconds. asset_id and
        metric cannot be changed — delete and recreate the rule instead. Any
        patch clears the rule's in-flight de-flap dwell candidate (E3.2).
      properties:
        row_version: { type: integer, format: int64 }
        comparator: { type: string, enum: [gt, lt, gte, lte] }
        threshold: { type: number, format: double }
        for_duration_seconds: { type: integer, minimum: 1, maximum: 86400 }
        severity: { type: string, enum: [critical, warning, info] }
        symptom_class: { type: string, enum: [availability, resource, unspecified] }
        enabled: { type: boolean }
        flap_dwell_seconds: { type: integer, minimum: 0, maximum: 86400 }
    SecurityRule:
      type: object
      description: >-
        A threshold-over-window SIEM detection config over
        security_observation (E8.1b-1): it fires when the count of matching
        observations for its asset in a trailing window meets a threshold. A
        firing is DERIVED by the leader-gated SecurityDetector (E8.1b-2)
        evaluating this config against security_observation and delivered as
        a create/link against Incident — never a reified Alert/Detection/
        Correlation row. last_state/last_transition_at/current_incident_id
        are the detector's last verdict, set only by it, never through PATCH.
      properties:
        rule_id: { type: string }
        asset_id: { type: string }
        observation_type: { type: string }
        min_severity:
          type: string
          enum: [info, low, medium, high, critical]
          default: info
          description: Count only observations at or above this severity.
        window_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: The trailing lookback the count is taken over.
        threshold_count:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Fire when the matching count meets or exceeds this value.
        incident_severity:
          type: string
          enum: [critical, high, medium, low]
          description: >-
            The severity of the Incident a future detector (E8.1b-2) will
            raise on a firing — the INCIDENT severity vocabulary, not
            min_severity's observation-severity scale.
        enabled: { type: boolean }
        last_state:
          type: string
          enum: [ok, firing]
          description: Set only by the detector (E8.1b-2). A new rule starts at "ok".
        last_transition_at:
          type: string
          format: date-time
          nullable: true
          description: Set only by the detector. Absent means never evaluated to a transition.
        current_incident_id:
          type: string
          nullable: true
          description: >-
            The open, security-sourced Incident this rule's firing is
            currently linked to (E8.1b-2). Absent/null means the rule is ok,
            or is firing but not yet correlated to an incident. Set only by
            the detector, never through PATCH; cleared on the matching
            firing->ok transition (the linked incident itself is not
            auto-resolved).
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SecurityRuleList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SecurityRule' }
    CreateSecurityRuleRequest:
      type: object
      required: [asset_id, observation_type, window_seconds, threshold_count, incident_severity]
      description: min_severity defaults to "info" when omitted. enabled defaults to true.
      properties:
        asset_id: { type: string }
        observation_type: { type: string }
        min_severity:
          type: string
          enum: [info, low, medium, high, critical]
          default: info
        window_seconds: { type: integer, minimum: 1, maximum: 86400 }
        threshold_count: { type: integer, minimum: 1, maximum: 1000000 }
        incident_severity: { type: string, enum: [critical, high, medium, low] }
        enabled: { type: boolean }
    PatchSecurityRuleRequest:
      type: object
      required: [row_version]
      description: >-
        Supply one or more of min_severity, window_seconds, threshold_count,
        incident_severity or enabled. asset_id and observation_type cannot be
        changed — delete and recreate the rule instead.
      properties:
        row_version: { type: integer, format: int64 }
        min_severity: { type: string, enum: [info, low, medium, high, critical] }
        window_seconds: { type: integer, minimum: 1, maximum: 86400 }
        threshold_count: { type: integer, minimum: 1, maximum: 1000000 }
        incident_severity: { type: string, enum: [critical, high, medium, low] }
        enabled: { type: boolean }
    IOC:
      type: object
      description: >-
        One entry in a tenant's indicator-of-compromise watchlist (E8.2a):
        reference data an operator curates, never a reified Threat/Event row.
        A future, separate detector (E8.2b) will match this entry against
        security_observation and raise an Incident on a hit — nothing does
        that yet; this row is config only.
      properties:
        ioc_id: { type: string }
        indicator_type:
          type: string
          enum: [ip, domain, url, file_hash, email]
        indicator_value:
          type: string
          description: >-
            Normalized before storage: always trimmed, additionally
            lower-cased for domain/url/email.
        severity:
          type: string
          enum: [critical, high, medium, low]
          description: >-
            The severity of the Incident a future detector (E8.2b) will
            raise on a match — the INCIDENT severity vocabulary, not
            security_observation's five-level observation-severity scale.
        enabled: { type: boolean }
        description: { type: string }
        source: { type: string }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IOCList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IOC' }
    CreateIOCRequest:
      type: object
      required: [indicator_type, indicator_value, severity]
      description: enabled defaults to true. description/source default to empty.
      properties:
        indicator_type: { type: string, enum: [ip, domain, url, file_hash, email] }
        indicator_value: { type: string, maxLength: 2048 }
        severity: { type: string, enum: [critical, high, medium, low] }
        enabled: { type: boolean }
        description: { type: string, maxLength: 2000 }
        source: { type: string, maxLength: 200 }
    PatchIOCRequest:
      type: object
      required: [row_version]
      description: >-
        Supply one or more of severity, enabled, description or source.
        indicator_type and indicator_value cannot be changed — delete and
        recreate the entry instead.
      properties:
        row_version: { type: integer, format: int64 }
        severity: { type: string, enum: [critical, high, medium, low] }
        enabled: { type: boolean }
        description: { type: string, maxLength: 2000 }
        source: { type: string, maxLength: 200 }
    IngestVulnFinding:
      type: object
      required: [asset_id, vuln_id, title, severity, scanner]
      description: >-
        vuln_id is deliberately not CVE-format-only — scanners emit GHSA/
        RHSA/vendor advisory codes too.
      properties:
        asset_id: { type: string }
        vuln_id:
          type: string
          maxLength: 100
          description: e.g. CVE-2024-1234, GHSA-xxxx-xxxx-xxxx, or a vendor-specific advisory code.
        title: { type: string, maxLength: 300 }
        severity:
          type: string
          enum: [none, low, medium, high, critical]
          description: The CVSS-derived rating (NVD scale) — its own vocabulary, distinct from incident/observation severity.
        scanner:
          type: string
          maxLength: 200
          description: Names the producer that reported this finding, e.g. nessus, qualys, trivy.
        description: { type: string, maxLength: 2000 }
    IngestVulnFindingsRequest:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/IngestVulnFinding' }
    VulnFindingUpsertResult:
      type: object
      description: >-
        One input finding's outcome, at that finding's input index — always
        present even when the finding was rejected, so a caller can correlate
        a failure back to the request it sent.
      properties:
        index: { type: integer }
        outcome: { type: string, enum: [accepted, rejected] }
        finding_id:
          type: string
          description: Present when accepted — the CANONICAL finding_id for (tenant, asset_id, vuln_id), which may be a pre-existing row, not a freshly minted one.
        status:
          type: string
          enum: [open, remediated, accepted_risk, false_positive]
          description: Present when accepted — the finding's status AFTER this write. "open" following a previously remediated/accepted_risk finding signals a reappearance.
        reason: { type: string, description: Present when outcome is rejected. }
    IngestVulnFindingsResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/VulnFindingUpsertResult' }
    VulnFinding:
      type: object
      description: >-
        A deduplicated vulnerability-on-asset finding (E8.3a): a stateful
        reified entity — like Incident/Asset, NOT a false noun — deduped by
        (tenant_id, asset_id, vuln_id) and carrying a governed lifecycle.
        Prioritization by CI criticality and remediation -> Incident linkage
        are E8.3b, a later, separate story.
      properties:
        finding_id: { type: string }
        asset_id: { type: string }
        vuln_id: { type: string }
        title: { type: string }
        severity: { type: string, enum: [none, low, medium, high, critical] }
        status:
          type: string
          enum: [open, remediated, accepted_risk, false_positive]
          description: >-
            open -> {remediated, accepted_risk, false_positive}; remediated/
            accepted_risk -> open (automatically, on scan reappearance);
            false_positive -> open ONLY via a manual PATCH re-triage, never
            via ingestion.
        first_seen:
          type: string
          format: date-time
          description: Set once, at first ingestion. Store-managed.
        last_seen:
          type: string
          format: date-time
          description: Refreshed by every ingestion UPSERT that names this row, including the false_positive branch. Store-managed.
        scanner: { type: string }
        description: { type: string }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VulnFindingList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VulnFinding' }
    PatchVulnFindingRequest:
      type: object
      required: [row_version, status]
      description: >-
        The ONLY mutation this endpoint performs is a lifecycle transition.
        severity/title/scanner/description are refreshed only by a later
        scan ingest (POST /v1/admin/vuln-findings), never by this endpoint.
      properties:
        row_version: { type: integer, format: int64 }
        status: { type: string, enum: [open, remediated, accepted_risk, false_positive] }
    MaintenanceWindow:
      type: object
      description: >-
        An operator-declared, one-shot [starts_at, ends_at) window during
        which one asset's alert firing->incident/notify side effect is
        suppressed (E3.3a, ADR-ALERTING-002). Never suppresses the underlying
        firing-state derivation itself, only the side effect; a recovery
        (firing->ok) is never suppressed. suppressed_count/last_suppressed_at
        are the visible, queryable record that a suppression happened — a
        suppression is never a silent drop. Dependency-aware suppression
        (silencing a CI's downstream/dependent CIs too) is E3.3b, deferred;
        this window covers exactly one asset_id.
      properties:
        window_id: { type: string }
        asset_id: { type: string }
        starts_at:
          type: string
          format: date-time
          description: Inclusive lower bound — a firing at exactly starts_at IS suppressed.
        ends_at:
          type: string
          format: date-time
          description: Exclusive upper bound — a firing at exactly ends_at is NOT suppressed.
        reason: { type: string, maxLength: 500 }
        created_by:
          type: string
          description: The authenticated actor who declared this window. Set server-side.
        suppressed_count:
          type: integer
          format: int64
          description: How many evaluation ticks found this window active and suppressed a firing.
        last_suppressed_at:
          type: string
          format: date-time
          nullable: true
          description: When this window last suppressed a firing, or absent if it never has.
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MaintenanceWindowList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MaintenanceWindow' }
    CreateMaintenanceWindowRequest:
      type: object
      required: [asset_id, starts_at, ends_at]
      description: >-
        ends_at must be strictly after starts_at — the window is half-open
        [starts_at, ends_at). reason is optional free text, not interpreted.
      properties:
        asset_id: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: string, maxLength: 500 }
    OnCallSchedule:
      type: object
      description: >-
        A named on-call rotation (E5.2a). Who is on call is never a field on
        this object — it is always computed via GET .../on-call from
        rotation_start_at/handoff_interval_seconds and the current ordered
        participant list.
      properties:
        schedule_id: { type: string }
        name: { type: string, maxLength: 200 }
        handoff_interval_seconds:
          type: integer
          minimum: 1
          description: Seconds between handoffs. UTC/seconds-based rotation math only.
        rotation_start_at: { type: string, format: date-time }
        status: { type: string, enum: [active, archived] }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OnCallScheduleList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OnCallSchedule' }
    CreateOnCallScheduleRequest:
      type: object
      required: [name, handoff_interval_seconds, rotation_start_at]
      properties:
        name: { type: string, maxLength: 200 }
        handoff_interval_seconds: { type: integer, minimum: 1 }
        rotation_start_at: { type: string, format: date-time }
    PatchOnCallScheduleRequest:
      type: object
      required: [row_version]
      description: Supply one or more of name, handoff_interval_seconds, rotation_start_at or status.
      properties:
        row_version: { type: integer, format: int64 }
        name: { type: string, maxLength: 200 }
        handoff_interval_seconds: { type: integer, minimum: 1 }
        rotation_start_at: { type: string, format: date-time }
        status: { type: string, enum: [active, archived] }
    OnCallParticipant:
      type: object
      description: One person's seat in a schedule's rotation order. Position is 0-based and contiguous 0..N-1.
      properties:
        participant_id: { type: string }
        schedule_id: { type: string }
        user_id: { type: string }
        position: { type: integer, minimum: 0 }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OnCallParticipantList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OnCallParticipant' }
    AddOnCallParticipantRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
    ReorderOnCallParticipantsRequest:
      type: object
      required: [participant_ids]
      description: >-
        Must name exactly the schedule's current participant set, in the
        desired new order — no more, no fewer.
      properties:
        participant_ids:
          type: array
          items: { type: string }
    EscalationPolicy:
      type: object
      description: >-
        A named, ordered chain of tiers (E5.2b-1). CONFIG ONLY: no engine,
        worker, paging or incident/notification wiring exists yet (E5.2b-2).
      properties:
        policy_id: { type: string }
        name: { type: string, maxLength: 200 }
        status: { type: string, enum: [active, archived] }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EscalationPolicyList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EscalationPolicy' }
    CreateEscalationPolicyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
    PatchEscalationPolicyRequest:
      type: object
      required: [row_version]
      description: Supply one or more of name or status.
      properties:
        row_version: { type: integer, format: int64 }
        name: { type: string, maxLength: 200 }
        status: { type: string, enum: [active, archived] }
    EscalationTier:
      type: object
      description: >-
        One rung in a policy's escalation ladder: page on_call_schedule_id's
        current on-call user, wait wait_seconds for an acknowledgement, then
        (E5.2b-2) advance to the next tier. Position is 0-based and
        contiguous 0..N-1.
      properties:
        tier_id: { type: string }
        policy_id: { type: string }
        position: { type: integer, minimum: 0 }
        on_call_schedule_id: { type: string }
        wait_seconds: { type: integer, minimum: 1 }
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EscalationTierList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EscalationTier' }
    AddEscalationTierRequest:
      type: object
      required: [on_call_schedule_id, wait_seconds]
      properties:
        on_call_schedule_id: { type: string }
        wait_seconds: { type: integer, minimum: 1 }
    ReorderEscalationTiersRequest:
      type: object
      required: [tier_ids]
      description: >-
        Must name exactly the policy's current tier set, in the desired new
        order — no more, no fewer.
      properties:
        tier_ids:
          type: array
          items: { type: string }
    OnCallNow:
      type: object
      description: >-
        The resolved on-call user for a schedule at a given instant.
        user_id/display_name are both absent when the schedule has no
        participants — an ordinary state, not an error.
      properties:
        schedule_id: { type: string }
        at: { type: string, format: date-time }
        user_id: { type: string }
        display_name: { type: string }
    NOCIncidentStatusCounts:
      type: object
      description: Open-class incident counts by status (E7.1).
      properties:
        open: { type: integer }
        acknowledged: { type: integer }
        investigating: { type: integer }
    NOCIncidentSeverityCounts:
      type: object
      description: Open-class incident counts by severity (E7.1).
      properties:
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
    NOCIncidentGrouping:
      type: object
      description: >-
        E4.2's root/collateral summary over the same open-class incident set.
        collateral_count is how many open-class incidents have a non-null
        root_incident_id; root_count is how many distinct roots those
        collateral incidents name.
      properties:
        root_count: { type: integer }
        collateral_count: { type: integer }
    NOCIncidentsOverview:
      type: object
      properties:
        open_total: { type: integer }
        by_status: { $ref: '#/components/schemas/NOCIncidentStatusCounts' }
        by_severity: { $ref: '#/components/schemas/NOCIncidentSeverityCounts' }
        grouped: { $ref: '#/components/schemas/NOCIncidentGrouping' }
    NOCAlertSeverityCounts:
      type: object
      properties:
        critical: { type: integer }
        warning: { type: integer }
        info: { type: integer }
    NOCAlertsOverview:
      type: object
      description: >-
        Currently-firing ENABLED alert rules (enabled = true AND
        last_state = 'firing') — derived state, never a reified Alert row.
      properties:
        firing_total: { type: integer }
        by_severity: { $ref: '#/components/schemas/NOCAlertSeverityCounts' }
    NOCAssetsOverview:
      type: object
      description: >-
        Category counts reused unchanged from GET /admin/assets/health
        (E1.5) — the bounded per-category sample list that endpoint also
        returns is not reproduced here.
      properties:
        stale: { type: integer }
        orphaned_assets: { type: integer }
        orphaned_business_services: { type: integer }
        incomplete: { type: integer }
    NOCOnCallEntry:
      type: object
      description: >-
        One ACTIVE schedule's current on-call resolution. user_id/
        display_name are both null when the schedule's roster is empty — an
        ordinary state, not an error.
      properties:
        schedule_id: { type: string }
        schedule_name: { type: string }
        user_id: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
    NOCEscalationsOverview:
      type: object
      description: The current size of the escalation_state work-queue (E5.2b-2).
      properties:
        active_total: { type: integer }
    NOCOverview:
      type: object
      description: >-
        The current operational state of the whole NOC loop (E7.1) — a
        transient, computed-at-request-time projection, never a stored
        Dashboard/Report/Overview entity (docs/PLATFORM-BUILD-PLAN.md §4).
      properties:
        incidents: { $ref: '#/components/schemas/NOCIncidentsOverview' }
        alerts: { $ref: '#/components/schemas/NOCAlertsOverview' }
        assets: { $ref: '#/components/schemas/NOCAssetsOverview' }
        on_call:
          type: array
          items: { $ref: '#/components/schemas/NOCOnCallEntry' }
        escalations: { $ref: '#/components/schemas/NOCEscalationsOverview' }
        generated_at: { type: string, format: date-time }
    IncidentTrendSeverityCounts:
      type: object
      description: One bucket's opened-incident breakdown by severity (E9.1).
      properties:
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
    IncidentTrendSourceCounts:
      type: object
      description: >-
        One bucket's opened-incident breakdown by source. alert is the
        honest alert-VOLUME proxy (ADR-NOC-008): this system has no
        alert-firing log, so it counts alert-sourced incidents (E4.1), not
        raw firings.
      properties:
        manual: { type: integer }
        alert: { type: integer }
    IncidentTrendPoint:
      type: object
      description: >-
        One contiguous, boundary-aligned bucket. Present, and zeroed, even
        when no incident matches it — the response is never sparse.
      properties:
        bucket_start: { type: string, format: date-time }
        opened_total: { type: integer }
        opened_by_severity: { $ref: '#/components/schemas/IncidentTrendSeverityCounts' }
        opened_by_source: { $ref: '#/components/schemas/IncidentTrendSourceCounts' }
        resolved_total: { type: integer }
    IncidentTrends:
      type: object
      description: >-
        Incident volume over time (E9.1) — a transient, computed-at-
        request-time projection, never a stored Dashboard/Report entity
        (docs/PLATFORM-BUILD-PLAN.md §4). from/to/bucket echo the validated,
        normalised (UTC) request. points is bounded to at most 744
        contiguous buckets (ADR-NOC-008).
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucket: { type: string, enum: [hour, day] }
        points:
          type: array
          items: { $ref: '#/components/schemas/IncidentTrendPoint' }
    Incident:
      type: object
      description: >-
        A stateful ITSM work item tracking operational work against a CI
        (E5.1) — the ratified reduced noun, never a reified generic "Ticket".
      properties:
        incident_id: { type: string }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        severity: { type: string, enum: [critical, high, medium, low] }
        status:
          type: string
          enum: [open, acknowledged, investigating, resolved, closed, reopened]
        source:
          type: string
          enum: [manual, alert, security]
          description: >-
            Read-only. manual: filed via this API. alert: created or linked
            by E4.1's alert-correlation pipeline off an alert-rule firing.
            security: created or linked by E8.1b-2's SecurityDetector off a
            security-rule firing.
        asset_id:
          type: string
          nullable: true
          description: The affected Configuration Item, or absent when unlinked.
        assignee_user_id:
          type: string
          nullable: true
          description: The responder accountable for this incident, or absent when unassigned.
        row_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        root_incident_id:
          type: string
          nullable: true
          description: >-
            Read-only (E4.2, ADR-ALERTING-004). Set/cleared exclusively by
            internal/grouping's leader-gated reconciliation pass — there is no
            write path for it through this API. Names the OPEN, alert-sourced
            incident this one is grouped under because its own asset
            transitively depends on the root's asset, which is itself "down".
            Absent when this incident is itself a root or standalone.
        is_root:
          type: boolean
          description: >-
            Read-only (E4.2). true when root_incident_id is absent — this
            incident anchors its own topology-aware group (or has none),
            rather than being grouped under another incident.
    IncidentList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
    CreateIncidentRequest:
      type: object
      required: [title, severity]
      description: >-
        Always created IncidentOpen, source manual — there is no field here
        to request source alert; that is set only by E4.1's correlation
        pipeline. asset_id/assignee_user_id are optional; when set, each is
        re-verified against the caller's tenant before the incident is
        written — a mismatch returns 404 (see POST /admin/incidents'
        description).
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        severity: { type: string, enum: [critical, high, medium, low] }
        asset_id: { type: string }
        assignee_user_id: { type: string }
    PatchIncidentRequest:
      type: object
      required: [row_version]
      description: >-
        Supply one or more of title, description, severity, asset_id.
        status and assignee_user_id are excluded — see POST .../transition
        and POST .../assign. asset_id is tri-state: absent leaves it
        unchanged, "" clears it, a non-empty id sets it (re-verified first).
      properties:
        row_version: { type: integer, format: int64, minimum: 1 }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        severity: { type: string, enum: [critical, high, medium, low] }
        asset_id: { type: string }
    TransitionIncidentRequest:
      type: object
      required: [row_version, status]
      properties:
        row_version: { type: integer, format: int64, minimum: 1 }
        status:
          type: string
          enum: [open, acknowledged, investigating, resolved, closed, reopened]
    AssignIncidentRequest:
      type: object
      required: [row_version]
      description: >-
        assignee_user_id null (or omitted) clears the assignment; a non-null
        id must name a user with an active membership in the caller's tenant.
      properties:
        row_version: { type: integer, format: int64, minimum: 1 }
        assignee_user_id: { type: string, nullable: true }
    IncidentEvent:
      type: object
      description: >-
        One append-only row of an incident's case timeline (E5.1). field/
        old_value/new_value are absent for the single "created" row — there
        is no prior state to diff against. alert_note (E4.1) is written only
        by the alert-correlation pipeline, never via this API.
      properties:
        event_id: { type: string }
        incident_id: { type: string }
        kind: { type: string, enum: [created, status_transitioned, assigned, alert_note] }
        field: { type: string }
        old_value: { type: string, nullable: true }
        new_value: { type: string, nullable: true }
        actor: { type: string }
        row_version: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
    IncidentTimelineList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IncidentEvent' }
    Setting:
      type: object
      description: >-
        `value` and `default` are rendered as the type the key's definition
        declares — a boolean for a bool setting, a number for an int setting —
        never as the string every value is stored as internally.
      properties:
        key: { type: string }
        type: { type: string, enum: [bool, int, string, enum] }
        description: { type: string }
        value: {}
        default: {}
        overridden: { type: boolean }
        row_version: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
    SettingList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Setting' }
    PutSettingRequest:
      type: object
      required: [value, row_version]
      properties:
        value: {}
        row_version:
          type: integer
          format: int64
          minimum: 0
          description: 0 to create a new override; the row_version last read to update one.
    Notification:
      type: object
      properties:
        notification_id: { type: string }
        channel: { type: string, enum: [email, webhook, inapp] }
        recipient: { type: string, maxLength: 320 }
        subject: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        status: { type: string, enum: [pending, sent, failed] }
        attempts: { type: integer }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
    AdminAuditRecord:
      type: object
      properties:
        chain_id: { type: string }
        seq: { type: integer, format: int64 }
        event_id: { type: string }
        operation: { type: string }
        actor: { type: string }
        subject_org_id: { type: string }
        subject_tenant_id: { type: string }
        subject_user_id: { type: string }
        payload_canonical:
          type: string
          format: byte
          description: The canonical bytes the chain hash was computed over.
        this_hash: { type: string, format: byte }
        occurred_at: { type: string, format: date-time }
    AdminAuditList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminAuditRecord' }
        next_cursor:
          type: string
          description: Present only when a further page exists.
    Tenant:
      type: object
      required: [tenant_id, slug, name, allowed_issuers, status, row_version, created_at, updated_at]
      properties:
        tenant_id:
          type: string
          description: Platform-minted identifier. Never supplied by the caller.
        slug:
          type: string
          description: Lowercase DNS-style label, 2-63 characters.
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        name: { type: string }
        external_id:
          type: string
          description: >-
            Identifier the identity provider asserts for this tenant (Entra tid,
            Okta org id). Bearer tokens are resolved against this, never against
            tenant_id, so the IdP can change without rewriting foreign keys.
            Empty until an identity provider is bound.
        allowed_issuers:
          type: array
          items: { type: string }
          description: >-
            Issuers (JWT iss) permitted to authenticate this tenant. An EMPTY
            array means the tenant may authenticate ONLY via the default IdP
            (ONEOPS_JWT_ISSUER) — safe by default and backward compatible. A
            tenant that brings its own additional IdP must list that issuer here;
            enforcement is fail-closed at the authentication boundary
            (ADR-IDENTITY-003).
        status:
          type: string
          enum: [active, suspended]
        row_version:
          type: integer
          format: int64
          description: Optimistic-concurrency guard.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tenant' }
    CreateTenantRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        name: { type: string }
        external_id:
          type: string
          description: Optional. Must be unique across tenants when non-empty.
        allowed_issuers:
          type: array
          items: { type: string }
          description: >-
            Optional. Issuers permitted to authenticate this tenant. Omit or
            leave empty for the safe default (default IdP only, ONEOPS_JWT_ISSUER).
            List an additional IdP's issuer to let it authenticate this tenant
            (ADR-IDENTITY-003).
    User:
      type: object
      required: [user_id, email, display_name, status, row_version, created_at, updated_at]
      properties:
        user_id:     { type: string }
        email:       { type: string, format: email }
        display_name: { type: string }
        status:
          type: string
          enum: [invited, active, suspended, deactivated]
        row_version: { type: integer, format: int64 }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
    TenantUser:
      type: object
      description: >-
        Deliberately narrower than User: an assignee/roster picker projection,
        not the User aggregate. No status, row_version or timestamps.
      required: [user_id, email, display_name]
      properties:
        user_id:      { type: string }
        email:        { type: string, format: email }
        display_name: { type: string }
    TenantUserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TenantUser' }
    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email:        { type: string, format: email, maxLength: 254 }
        display_name: { type: string, maxLength: 200 }
    PatchUserRequest:
      type: object
      required: [row_version]
      description: Supply exactly one of display_name or status.
      properties:
        row_version:  { type: integer, format: int64, minimum: 1 }
        display_name: { type: string, maxLength: 200 }
        status:
          type: string
          enum: [invited, active, suspended, deactivated]
    Organization:
      type: object
      required: [org_id, tenant_id, slug, name, status, row_version, created_at, updated_at]
      properties:
        org_id:
          type: string
          description: Platform-minted identifier. Never supplied by the caller.
        tenant_id:
          type: string
          description: >-
            The tenant realising this organization's isolation boundary, 1:1 and
            enforced by constraint. It points AT the boundary rather than naming
            this row's owner. Minted server-side alongside org_id.
        slug:
          type: string
          description: Lowercase DNS-style label, 2-63 characters. Unique across organizations and tenants.
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        name: { type: string }
        status:
          type: string
          enum: [active, suspended]
        row_version: { type: integer, format: int64 }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }
    OrganizationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
    CreateOrganizationRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        name: { type: string }
    PatchOrganizationRequest:
      type: object
      required: [row_version, status]
      properties:
        row_version: { type: integer, format: int64, minimum: 1 }
        status:
          type: string
          enum: [active, suspended]
    PatchTenantRequest:
      type: object
      description: >-
        Supply a status change, or an allowed_issuers replacement. When
        allowed_issuers is present it is the operation and status is not read; an
        empty array resets the tenant to the safe default (default IdP only).
      properties:
        status:
          type: string
          enum: [active, suspended]
        allowed_issuers:
          type: array
          items: { type: string }
          description: >-
            Replacement set of issuers permitted to authenticate this tenant.
            Empty resets to the default IdP only (ADR-IDENTITY-003).
    GovernanceArchiveRequest:
      type: object
      required: [target_retention]
      properties:
        target_retention:
          type: string
          description: Archival retention class to set.
          enum: [historical_record, historical_evidence, audit_record, superseded_plan]
    GovernanceState:
      type: object
      properties:
        lifecycle: { type: string }
        retention_class: { type: string }
        authority: { type: string }
    GovernanceAudit:
      type: object
      description: Read-only audit metadata; exposes no internal hashes or event ids.
      properties:
        operation_id: { type: string }
        chain_id: { type: string }
        recorded: { type: boolean }
    GovernanceResponse:
      type: object
      properties:
        operation: { type: string }
        cfg_id: { type: string }
        actor: { type: string }
        occurred_at: { type: string, format: date-time }
        removed: { type: boolean }
        row_version: { type: integer, format: int64 }
        state: { $ref: '#/components/schemas/GovernanceState' }
        audit: { $ref: '#/components/schemas/GovernanceAudit' }
        approvals: { $ref: '#/components/schemas/GovernanceApprovalStatus' }
    GovernanceApprovalStatus:
      type: object
      description: >
        Multi-approver quorum status (ADR-GOV-005). Present only on the
        response to POST .../approve. met is false, and the sibling state
        field's lifecycle is unchanged, until count >= required.
      properties:
        count: { type: integer, description: Distinct approvers recorded so far, including this call. }
        required: { type: integer, description: The tenant's configured governance_required_approvals. }
        met: { type: boolean }
        summary: { type: string, example: "approvals: 1 of required 2" }
    GovernanceApprover:
      type: object
      properties:
        approver_user_id: { type: string }
        approved_at: { type: string, format: date-time }
    GovernanceApprovalsResponse:
      type: object
      description: Who has recorded a distinct approval of a governance object so far, against its tenant's configured quorum (ADR-GOV-005).
      properties:
        cfg_id: { type: string }
        approvers:
          type: array
          items: { $ref: '#/components/schemas/GovernanceApprover' }
        count: { type: integer }
        required: { type: integer }
        met: { type: boolean }
    GovernanceStateResponse:
      type: object
      properties:
        cfg_id: { type: string }
        lifecycle: { type: string }
        retention_class: { type: string }
        retention_policy: { type: string }
        authority: { type: string }
        row_version: { type: integer, format: int64 }
        ratified_by: { type: string }
        review_cycle: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GovernanceHistoryItem:
      type: object
      properties:
        seq: { type: integer, format: int64 }
        operation: { type: string }
        actor: { type: string }
        occurred_at: { type: string, format: date-time }
        operation_id: { type: string }
        removed: { type: boolean }
        resulting_state: { $ref: '#/components/schemas/GovernanceState' }
    GovernanceHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GovernanceHistoryItem' }
        next_cursor: { type: string }
    AuditChainResponse:
      type: object
