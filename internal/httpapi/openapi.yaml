        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Batch-UPSERT vulnerability findings from one scan (E8.3a)
      description: >-
        Dedup key is (tenant_id, asset_id, vuln_id): a finding not seen
        before is created open; an open/remediated/accepted_risk finding
        already on record is refreshed and forced back to open (a
        remediated/accepted-risk finding reappearing in a later scan means it
        was not actually fixed / the accepted risk is still present); a
        false_positive finding is left exactly as an operator last judged it
        — only its last_seen timestamp moves. asset_id must already name a
        Configuration Item visible to the caller's tenant, re-verified
        server-side; a finding naming a cross-tenant or nonexistent asset_id
        is reported as a rejected result at its own index, not as a
        batch-aborting error. Re-ingesting an identical scan is idempotent:
        no duplicate rows. Prioritization by CI criticality and
        remediation -> Incident linkage (E8.3b) are a later, separate story —
        nothing here ranks findings or opens an Incident; a finding open but
        absent from a later scan is NOT auto-remediated (deferred).
      operationId: ingestVulnFindings
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestVulnFindingsRequest' }
      responses:
        '200':
          description: One outcome per input finding, at that finding's input index
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestVulnFindingsResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

