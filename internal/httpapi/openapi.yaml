        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutSettingRequest' }
      responses:
        '200':
          description: The updated effective setting
          content: { application/json: { schema: { $ref: '#/components/schemas/Setting' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /v1/admin/organizations:
    get:
      summary: List organizations, or resolve one by slug
      description: >-
        An Organization is a scope of Identity to which Policy attaches, realised
        as an isolation boundary by exactly one Tenant (ADR-IDENTITY-001 §4).
        The registry is global rather than tenant-scoped: `tenant_id` is
        discovered BY reading this mapping, so scoping the mapping on it would be
        circular (ADR-IDENTITY-002 §3.1). Supplying `slug` resolves a single
        organization and returns a list of zero or one — the collection exists
        whether or not anything in it matched, so a filter that finds nothing is
        an empty page, not a 404. Paging is keyset over `org_id`, which is a ULID
        and therefore ordered by creation.
      operationId: listOrganizations
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: slug
          in: query
          description: Resolve a single organization by its addressable name.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
        - name: after
          in: query
          description: Keyset cursor — the last org_id of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of organizations
          content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    post:
      summary: Register an organization and the tenant realising it
      description: >-
        Creates the Identity scope AND its isolation boundary in one
        transaction: both rows or neither (ADR-IDENTITY-001 §7.1). An
        organization whose tenant was not created would be an Identity scope
        with no isolation, and a tenant with no organization would be a boundary
        nothing points at.


        Neither identifier is accepted from the caller. Both are minted
        server-side, so a caller cannot choose a tenant_id colliding with the
        system tenant. The slug is unique across organizations and tenants
        alike, so a slug already held by either is a conflict.
      operationId: createOrganization
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrganizationRequest' } } }
      responses:
        '201':
          description: Created organization
          content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/organizations/{id}:
    get:
      summary: Get an organization
      operationId: getOrganization
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The organization
          content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Suspend or reactivate an organization
      description: >-
        Suspension is the only mutation the registry exposes, and it cascades to
        the realising tenant in the same transaction (ADR-IDENTITY-001 §8.3).
        The cascade is the point: the authentication boundary reads tenant
        status, so suspending the organization alone would leave its tenant
        serving requests for a scope nobody may enter.


        An organization is never deleted. Governed objects are anchored to its
        tenant by an append-only audit chain, so removing it would orphan
        records that cannot themselves be removed.


        `row_version` is required and is the version last read for this
        organization. A stale value is a 409: the record changed underneath the
        caller, who must re-read before deciding again.
      operationId: patchOrganization
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchOrganizationRequest' } } }
      responses:
        '200':
          description: Updated organization
          content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /v1/admin/tenants:
