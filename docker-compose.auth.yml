# Bundled Keycloak for a turnkey, real OIDC browser login on top of the demo
# stack (E-AUTH.1). Additive and opt-in: `make up` / `docker-compose.yml` are
# untouched, and this file changes nothing about the default auth-disabled
# demo flow. Bring it up with `make up-auth` (or `docker compose -f
# docker-compose.auth.yml up -d`) alongside the regular `make up`.
#
# The realm (`deploy/keycloak/oneops-realm.json`) is imported at startup
# (`--import-realm`). KC_HOSTNAME is pinned to the exact URL the browser AND
# the host-run Go control plane both resolve — http://localhost:8081 — so the
# `iss` Keycloak stamps into every token, the issuer OneOps validates
# (ONEOPS_JWT_ISSUER), and the issuer the browser OIDC-discovers are the same
# string. See docs/PILOT-AUTH.md for the full run recipe and the "point at
# your own IdP" pilot guidance.
name: oneops-auth

services:
  keycloak:
    container_name: oneops-keycloak
    image: quay.io/keycloak/keycloak:26.0.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Full-URL hostname (Keycloak 26 hostname v2): this exact string becomes
      # the `iss` in issued/discovered tokens. It must match ONEOPS_JWT_ISSUER
      # and what the browser fetches `/.well-known/openid-configuration` from.
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      # Host 8081 -> container 8080 (Keycloak's default HTTP port). Chosen so
      # it never collides with the control plane's own :8080.
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/oneops-realm.json:/opt/keycloak/data/import/oneops-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
