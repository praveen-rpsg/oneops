name: ci

on:
  pull_request:
  push:
    # The default branch is `master`. It was previously absent from this list,
    # so every push to the default branch bypassed CI entirely — which is how
    # the two HTTP 500 defects reached the v1.0.0 GA tag. `main` is retained so
    # the pipeline survives a future default-branch rename.
    branches: [master, main, "release/**"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: unit tests (race + coverage)
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: build
        run: make build

  # PostgreSQL-backed integration tests. These carry the `integration` build tag
  # (so the unit job never compiles them) and require TEST_DATABASE_URL. The job
  # FAILS if any integration test is skipped — the pipeline must actually exercise
  # the SQL layer (governance atomic transaction, hash chain, webhook/policy/
  # timeline persistence), not silently skip it.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oneops
          POSTGRES_PASSWORD: oneops
          POSTGRES_DB: oneops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oneops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://oneops:oneops@localhost:5432/oneops_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: integration tests (race, fail on skip)
        run: |
          set -euo pipefail
          go test -tags integration -race -count=1 -v \
            ./internal/store/postgres/... ./internal/httpapi/... 2>&1 | tee itest.log
          if grep -q -- '--- SKIP' itest.log; then
            echo "::error::an integration test was SKIPPED — the SQL layer was not exercised"
            exit 1
          fi

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ariga/setup-atlas@v0
      - name: validate migration directory and checksum
        run: atlas migrate validate --dir "file://internal/store/migrate/sql"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          # Pinned, and kept identical to GOLANGCI_VERSION in the Makefile.
          # `latest` silently changes the gate under the team: a release that
          # adds a check turns an unrelated push red, and local `make lint`
          # would disagree with CI about what passes.
          version: v2.12.2

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
      - name: trivy-fs
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  # The console ships inside the Go binary, so its typecheck and unit tests are
  # release gates exactly like the Go suite. The bundle itself is a build
  # artifact and is not committed; this job proves it still builds from source.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm --dir web install --frozen-lockfile
      - name: typecheck
        run: pnpm --dir web exec tsc -b --noEmit
      - name: unit tests
        run: pnpm --dir web exec vitest run
      - name: build bundle
        run: pnpm --dir web build

  docker:
    runs-on: ubuntu-latest
    needs: [build-test, web]
    steps:
      - uses: actions/checkout@v4
      - name: build image (no push)
        run: docker build -t oneops/controlplane:ci .
