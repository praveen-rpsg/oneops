# Local override — host-port remaps for this machine only.
#
# Other projects on this laptop already hold the stack's default ports:
#   5432 → host postgres      5433 → desiauction-postgres
#   6380 → askrpsg_redis      9000/9001 → desiauction-minio
#
# OneOps therefore claims its own block. Container ports are unchanged, so
# anything running inside the compose network still uses the defaults.
services:
  postgres:
    ports: !override
      - "5435:5432"

  redis:
    ports: !override
      - "6381:6379"

  minio:
    ports: !override
      - "9002:9000"
      - "9003:9001"
