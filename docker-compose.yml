name: oneops

services:
  postgres:
    container_name: oneops-postgres
    # Timescale-enabled, pg16-compatible (D1/ADR-TELEMETRY-001): telemetry_sample
    # is a TimescaleDB hypertable, a regular Postgres table under the hood, so
    # RLS still applies unchanged. This image is the official postgres:16
    # image with the timescaledb extension compiled in and
    # shared_preload_libraries pre-configured — everything else about it
    # (env vars, entrypoint, data directory, port) is unchanged from
    # postgres:16-alpine. -oss is the Apache-2.0-licensed build (no
    # Timescale-License-only features), pinned rather than :latest-pg16 for
    # the same reproducibility reason every other pulled image/tool in this
    # repo is pinned (see OASDIFF_VERSION, GOLANGCI_VERSION in the Makefile).
    image: timescale/timescaledb:2.19.3-pg16-oss
    environment:
      POSTGRES_DB: oneops
      POSTGRES_USER: oneops
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneops -d oneops"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    container_name: oneops-nats
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    container_name: oneops-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    container_name: oneops-opensearch
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  minio:
    container_name: oneops-minio
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: oneops
      MINIO_ROOT_PASSWORD: devsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
